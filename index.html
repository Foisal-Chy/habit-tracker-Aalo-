<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aalo – Daily Companion</title>
<meta name="theme-color" content="#f4f1ea"><meta name="color-scheme" content="light dark"><meta name="description" content="Aalo: তোমার দিনের শান্ত সঙ্গী। নামাজ, পানি, ঘুম, পড়াশোনা, ব্যায়াম আর মনের কথা এক জায়গায়। ইন্টারনেট ছাড়াই চলে।"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aalo">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Sora:wght@500;700;800&display=swap">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--line:#e7e0d1;--tx:#17211b;--mu:#76806f;--ac:#0e9f6e;--soft:#e2f3ea;--gold:#d99a22;--bad:#d9483f;--ok:#0e9f6e;--blue:#3b8fd6;--ind:#6a6fd8;--warn:#d99a22;--sh:0 1px 2px rgba(40,30,10,.05),0 14px 34px -14px rgba(40,30,10,.18);--serif:'Tiro Bangla','Hind Siliguri',serif;--num:'Sora','Hind Siliguri',sans-serif}
[data-t=dark]{--bg:#070c0f;--card:#0f181c;--line:#1b2a30;--tx:#e8f1ee;--mu:#86999f;--ac:#34d399;--soft:#10312a;--gold:#f0b43c;--bad:#f2675d;--ok:#34d399;--blue:#5aaaf0;--ind:#8b90f0;--warn:#f0b43c;--sh:0 0 0 1px rgba(255,255,255,.025),0 18px 40px -18px #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:15px/1.55 'Hind Siliguri','Nirmala UI',system-ui,sans-serif;min-height:100vh;background:radial-gradient(800px 460px at 105% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),radial-gradient(640px 420px at -15% 38%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
#app{max-width:600px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 130px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
small{font-size:12px}.mu{color:var(--mu)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.th{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px}.th h3{margin:0;font:400 19px var(--serif)}.th small{color:var(--mu)}
/* header */
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hd .dt{flex:1;text-align:center;line-height:1.25}.hd b{font:400 18px var(--serif);display:block}
.ib{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;transition:transform .12s}.ib:active{transform:scale(.9)}.ib:disabled{opacity:.3}
.pill{background:var(--soft);color:var(--ac);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13px}
/* sky hero */
.sky{--s1:#1a74b8;--s2:#4aa8e3;--s3:#86cdf2;position:relative;overflow:hidden;border-radius:30px;color:#fff;margin-bottom:14px;background:linear-gradient(175deg,var(--s1),var(--s2) 58%,var(--s3));box-shadow:0 24px 40px -24px var(--s1);text-shadow:0 1px 8px rgba(0,0,0,.28)}
.sk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 18px 0;position:relative;z-index:2}
.gr{font:400 26px/1.2 var(--serif)}.sk-top small{opacity:.88}
.mini{position:relative;width:58px;text-align:center;flex:none}.mini svg{display:block;width:58px;height:58px}.mini b{position:absolute;left:0;right:0;top:0;height:58px;display:grid;place-items:center;font:700 17px var(--num)}.mini small{font-size:11px}
.arc{display:block;width:100%;height:auto;margin-top:-8px}
.arc .nd{cursor:pointer;transition:transform .15s}.arc .nd:active{opacity:.7}
.arc .lb{font:600 10.5px 'Hind Siliguri',sans-serif;fill:#fff}.arc .sy{font:700 15px 'Hind Siliguri',sans-serif;fill:#fff}
.arc .pl{fill:none;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pl 1.9s ease-out infinite}
.arc .tw{animation:tw 3.2s ease-in-out infinite}
@keyframes pl{from{transform:scale(1);opacity:.95}to{transform:scale(1.8);opacity:0}}@keyframes tw{50%{opacity:.25}}
.msg{margin:-6px 12px 0;padding:13px 15px;border-radius:20px;background:rgba(0,0,0,.26);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:400 17px/1.55 var(--serif)}
.nx{display:flex;justify-content:space-between;gap:8px;padding:11px 18px 15px;font-size:13px}.nx b{font-weight:600}
/* streak chips */
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:112px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-size:13px;box-shadow:var(--sh)}.chip b{font:800 21px var(--num);display:block;line-height:1.3}.chip small{display:block;color:var(--mu);margin-top:5px;font-size:11px}
.bar{height:6px;border-radius:9px;background:var(--bg);overflow:hidden;margin-top:6px;border:1px solid var(--line)}.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--ac));transition:width .5s}
/* water */
.wb{display:flex;align-items:center;gap:18px}.gls{width:108px;flex:none;overflow:visible}
.wl{transition:transform 1s cubic-bezier(.3,1.35,.5,1)}.w1,.w2{fill:url(#wg)}.w2{opacity:.5;animation:wv 5.5s linear infinite reverse}.w1{animation:wv 3.2s linear infinite}
@keyframes wv{to{transform:translateX(-50px)}}
.wc{flex:1}.wc>b{font:800 46px/1 var(--num)}.wc>b small{font:500 14px 'Hind Siliguri';color:var(--mu)}.wc p{margin:4px 0 12px;color:var(--mu);font-size:13px}.wc .row2{display:flex;gap:8px}
.sq{width:46px;height:46px;border-radius:15px;background:var(--bg);border:1px solid var(--line);font-size:22px;flex:none}.sq:active,.bt:active{transform:scale(.94)}
.bt{flex:1;height:46px;border-radius:15px;background:linear-gradient(135deg,#3b9be6,#2a6fd0);color:#fff;font-weight:700;box-shadow:0 10px 20px -10px #2a6fd0}
/* 24h */
.d24{display:flex;height:36px;border-radius:13px;overflow:hidden;gap:2px;background:var(--line)}.d24 i{display:block;min-width:0;transition:flex .5s}.d24 i:first-child{border-radius:13px 0 0 13px}.d24 i:last-child{border-radius:0 13px 13px 0}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 4px;font-size:12px;color:var(--mu)}.lg b{color:var(--tx);font-weight:600}.lg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.warn{background:rgba(217,72,63,.1);color:var(--bad);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:8px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.rw>div:first-child{min-width:0;flex:1}.rw b{display:block;font-weight:600}.rw small{color:var(--mu)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:36px;height:36px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:20px;line-height:1}.stp button:active{transform:scale(.88)}
.stp input{width:58px;text-align:center;font:700 16px var(--num);border:1px solid var(--line);border-radius:12px;padding:7px 2px;background:var(--card);color:var(--tx)}.stp .u{font-size:12px;color:var(--mu);width:34px}
/* mood, quote */
.mood{display:flex;justify-content:space-between;margin-bottom:10px}.mood button{font-size:31px;filter:grayscale(1) opacity(.4);transition:.2s;border-radius:16px;padding:2px 7px}.mood button.on{filter:none;transform:scale(1.25) translateY(-2px)}
textarea,select,.f input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px}textarea{resize:vertical}
.qt{background:linear-gradient(145deg,var(--card),var(--soft));overflow:hidden}.qt .qm{position:absolute;right:14px;top:-18px;font:400 120px/1 var(--serif);color:var(--ac);opacity:.14}.qt p{margin:0 0 8px;font:400 19px/1.65 var(--serif);position:relative}.qt small{color:var(--mu)}
details.card summary{cursor:pointer;font-weight:600;list-style:none}details.card summary::-webkit-details-marker{display:none}details.card summary:after{content:"＋";float:right;color:var(--mu)}details[open].card summary:after{content:"－"}details p{font-size:13px;color:var(--mu);margin:10px 0 0}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10;pointer-events:none}
.nv{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(6,1fr);width:min(470px,calc(100% - 28px));padding:6px;border-radius:28px;background:color-mix(in srgb,var(--card) 76%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);box-shadow:0 16px 34px -12px rgba(0,0,0,.35)}
.nv .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/6);border-radius:22px;background:var(--soft);transform:translateX(calc(var(--i)*100%));transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.nv button{position:relative;display:grid;justify-items:center;gap:1px;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--mu);transition:color .2s}.nv button.on{color:var(--ac)}.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* stats */
.seg{display:flex;gap:6px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}.seg button{flex:1;padding:8px;border-radius:12px;font-weight:600;color:var(--mu);transition:.2s}.seg .on{background:var(--ac);color:var(--card)}.seg:has(button:disabled){opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}.st small{display:block;color:var(--mu)}.st b{font:800 22px var(--num)}
.lvl{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#0f3d33,#0b1f2e);color:#e8f6ef;border-color:transparent}.lvl .lv{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#34d399,#f0b43c);color:#07251c;display:grid;place-items:center;font:800 28px var(--num);flex:none;box-shadow:0 0 28px -4px #34d39988}.lvl h3{margin:0;font:400 21px var(--serif)}.lvl small{opacity:.75}.lvl .bar{background:rgba(255,255,255,.14);border-color:transparent;margin:8px 0 4px}.lvl .bar i{background:linear-gradient(90deg,#34d399,#f0b43c)}
.chart{width:100%;height:auto}.chart text{font-size:9px;fill:var(--mu)}
.dnw{display:flex;align-items:center;gap:14px}.dn{width:128px;flex:none}.dnw .lg{flex-direction:column;margin:0;gap:4px}
.ins{display:flex;gap:10px;background:var(--soft);border-radius:16px;padding:11px 13px;margin-bottom:8px;font-size:14px}.ins span{font-size:20px;line-height:1.3}
.rr{display:grid;grid-template-columns:54px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:7px 0}.rr b{font-family:var(--num);font-size:12px;text-align:right}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.heat i{aspect-ratio:1;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.bdgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bdg{text-align:center;padding:10px 4px;border-radius:16px;background:var(--bg);font-size:11px;line-height:1.3;border:1px solid var(--line)}.bdg span{display:block;font-size:26px;margin-bottom:3px}.bdg.off span{filter:grayscale(1) opacity(.35)}.bdg.on{background:var(--soft);border-color:var(--ac)}.bdg small{display:block;color:var(--mu);font-size:10px;margin-top:2px}
/* focus */
.fr{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:8px auto 18px}.fr svg{width:100%;height:100%;transform:rotate(-90deg)}.fr .ft{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.fr .ft b{font:700 54px/1.1 var(--num);letter-spacing:-.02em}.fr .glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%)}.fr.run .glow{animation:br 5s ease-in-out infinite}@keyframes br{50%{transform:scale(1.14);opacity:.6}}
.dch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}.dch button{padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:600 14px var(--num)}.dch .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.dch button:disabled{opacity:.4}
.fbt{display:flex;gap:10px}.btn{display:block;width:100%;padding:14px;border-radius:16px;background:var(--ac);color:var(--bg);font-weight:700;margin-bottom:8px;text-align:center;transition:transform .12s}.btn:active{transform:scale(.97)}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn.d{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
/* settings */
.f{display:grid;gap:5px;margin-bottom:10px}.f label{font-size:13px;color:var(--mu);font-weight:600}
.sw{position:relative;display:inline-block;width:50px;height:30px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.25s}.sw span:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}.sw input:checked+span{background:var(--ac)}.sw input:checked+span:before{transform:translateX(20px)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
/* sheet */
.sh{position:fixed;inset:0;z-index:20;display:none}.sh.on{display:block}.shb{position:absolute;inset:0;background:rgba(5,12,10,.5);backdrop-filter:blur(3px);animation:fd .25s}
.shc{position:absolute;left:50%;bottom:0;width:min(560px,100%);transform:translateX(-50%);background:var(--card);border-radius:30px 30px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:sl .38s cubic-bezier(.2,1,.3,1);box-shadow:0 -20px 60px -20px #000a}
.grab{display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sht{text-align:center;margin-bottom:14px}.sht h3{margin:0;font:400 28px var(--serif)}.sht small{color:var(--mu)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.pg button{border-radius:20px;padding:16px 4px;border:2px solid var(--line);background:var(--bg);font-weight:600;display:grid;gap:4px;justify-items:center}.pg button span{font-size:26px;font-weight:800}
.pg .p{color:var(--ok)}.pg .q{color:var(--warn)}.pg .m{color:var(--bad)}.pg .on.p{background:var(--soft);border-color:var(--ok)}.pg .on.q{background:rgba(217,154,34,.14);border-color:var(--warn)}.pg .on.m{background:rgba(217,72,63,.12);border-color:var(--bad)}
.party{text-align:center;padding:6px 0 4px}.party .em{font-size:64px;line-height:1.1;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--gold) 70%,transparent));animation:pop .6s cubic-bezier(.3,1.6,.5,1)}.party h3{margin:8px 0 6px;font:400 26px var(--serif)}.party p{margin:0 0 16px;color:var(--mu)}
@keyframes sl{from{transform:translate(-50%,100%)}}@keyframes fd{from{opacity:0}}@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:25;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
#app.an>*{animation:up .5s cubic-bezier(.2,.9,.3,1) both}#app.an>*:nth-child(n+3){animation-delay:.06s}#app.an>*:nth-child(n+5){animation-delay:.12s}#app.an>*:nth-child(n+7){animation-delay:.18s}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.chip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ck{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}.ck:first-of-type{border-top:0}
.cb{width:28px;height:28px;border-radius:10px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:800;transition:.2s;background:var(--bg)}
.ck.on .cb{background:var(--ac);border-color:var(--ac);color:var(--card);transform:scale(1.06)}
.ck .tx{flex:1;min-width:0;overflow-wrap:anywhere}.ck.on .tx{text-decoration:line-through;color:var(--mu)}.ck.sel .tx{color:var(--ac);font-weight:600}.ck .mn{font-size:11px;color:var(--mu)}
.xb{width:32px;height:32px;border-radius:10px;color:var(--mu);font-size:15px;flex:none}.xb:active{background:var(--bg)}
.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.add button{padding:0 18px;border-radius:14px;background:var(--ac);color:var(--card);font-weight:700}
.mini-btn{padding:7px 13px;border-radius:99px;background:var(--soft);color:var(--ac);font-weight:600;font-size:13px;flex:none}.mini-btn:active{transform:scale(.94)}
.hint{font-size:12.5px;color:var(--mu)}
.hp{display:flex;flex-wrap:wrap;gap:8px}.hp button{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.2s}.hp button.on{background:var(--soft);border-color:var(--ac);color:var(--ac)}.hp small{color:var(--gold)}.hp button:active{transform:scale(.95)}
.gd{display:flex;gap:12px;align-items:center}.gd svg{width:124px;height:112px;flex:none;overflow:visible}.gd .gi{flex:1;min-width:0}.gd h4{margin:0;font:400 21px var(--serif)}
.gd .stem{transform-origin:70px 102px;animation:sway 5s ease-in-out infinite}@keyframes sway{50%{transform:rotate(2.4deg)}}
.gd.wilt svg{filter:grayscale(.65) saturate(.8)}.gd.wilt .stem{transform:rotate(9deg);animation:none}
.q{padding:10px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.q>div:first-child{display:flex;justify-content:space-between;gap:8px}.q b{font-weight:600}.q.ok b{color:var(--ok)}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}.ex:first-of-type{border-top:0}
.ex .dd{width:58px;height:58px;border-radius:18px;background:var(--soft);color:var(--ac);display:grid;place-content:center;text-align:center;font:800 22px/1.05 var(--num);flex:none}.ex .dd small{font:500 10px 'Hind Siliguri'}.ex.urg .dd{background:rgba(217,72,63,.12);color:var(--bad)}
.amal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amal>div{background:var(--bg);border-radius:18px;padding:12px;border:1px solid var(--line)}
.kz{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}.kz b{font:800 30px var(--num)}
.tb{width:min(250px,70vw);aspect-ratio:1;margin:6px auto 14px;position:relative}.tb svg{width:100%;height:100%;transform:rotate(-90deg)}
.tb button{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--ac) 35%,#fff),var(--ac));color:#fff;font:800 52px var(--num);box-shadow:0 14px 34px -10px var(--ac),inset 0 -8px 18px rgba(0,0,0,.2);transition:transform .08s;user-select:none;-webkit-user-select:none;touch-action:manipulation}.tb button:active{transform:scale(.94)}

়ো","Release"],["চেপে ওপরে টানো","Squeeze and pull up"],["শ্বাস ছাড়ো","Breathe out"],["শ্বাস নাও","Breathe in"],["ক্যাট: পিঠ ওপরে","Cat: back up"],["কাউ: পিঠ নিচে","Cow: back down"],["পেটের চর্বি","Belly fat"],["পেট","Abs"],["মাংসপেশি","Muscle"],["ওজন কমানো","Weight loss"],["যৌন সুস্থতা","Sexual wellbeing"],["নমনীয়তা","Flexibility"],["সকালে বা বিকেলে, সপ্তাহে ৪–৫ দিন; আগে ৫ মিনিট ওয়ার্ম-আপ। সঙ্গে খাওয়া ঠিক রাখো।","Morning or afternoon, 4-5 days a week; warm up 5 minutes first. Keep your diet in order too."],["সকালে বা খাবারের অন্তত ২ ঘণ্টা পর; সপ্তাহে ৩–৪ দিন।","Morning or at least 2 hours after a meal; 3-4 days a week."],["সপ্তাহে ৩–৪ দিন, বিকেল বা সন্ধ্যায়; একই পেশিকে টানা দুই দিন নয়।","3-4 days a week, afternoon or evening; not the same muscle two days in a row."],["সকালে বা বিকেলে, সপ্তাহে ৪–৫ দিন; আগে ৫ মিনিট ওয়ার্ম-আপ করে নাও।","Morning or afternoon, 4-5 days a week; warm up for 5 minutes first."],["প্রতিদিন করা যায়; শান্ত জায়গায়, সকালে বা ঘুমের আগে।","Can be done daily; in a quiet place, in the morning or before sleep."],["ব্যায়ামের পরে বা ঘুমের আগে; প্রতিদিন করা যায়।","After exercise or before sleep; can be done daily."],["প্ল্যাঙ্ক","Plank"],["পেট, কোমর আর পিঠের গভীর পেশি শক্ত করে এবং শরীরের ভঙ্গি ঠিক রাখে।","Strengthens the abdominal, hip and deep back muscles and keeps your posture right."],["কনুই কাঁধের ঠিক নিচে রেখে উপুড় হও।","Lie face down with elbows right under your shoulders."],["পায়ের আঙুলে ভর দিয়ে শরীর মাথা থেকে গোড়ালি পর্যন্ত সোজা রাখো।","Balance on your toes and keep your body straight from head to heels."],["পেট ভেতরের দিকে টেনে রাখো, স্বাভাবিকভাবে শ্বাস নাও।","Pull the belly in and breathe normally."],["সময় শেষ হলে আস্তে নামো।","When time is up, lower down slowly."],["কোমর ঝুলে পড়া বা বেশি উঁচু করা","Letting the hips sag or lifting them too high"],["শ্বাস আটকে রাখা","Holding your breath"],["ঘাড় তুলে অনেক সামনে তাকানো","Lifting the neck and looking far ahead"],["কোমরে ব্যথা হলে থামো, হাঁটু মাটিতে রেখে করো।","If your lower back hurts, stop and do it with your knees on the floor."],["ক্রাঞ্চ","Crunch"],["পেটের ওপরের দিকের পেশি শক্ত করে।","Strengthens the upper abdominal muscles."],["চিত হয়ে শুয়ে হাঁটু ভাঁজ করো, পা মাটিতে।","Lie on your back with knees bent and feet on the floor."],["হাত মাথার পেছনে হালকা রাখো, কনুই দুই পাশে।","Keep your hands lightly behind your head, elbows out to the sides."],["পেটের জোরে কাঁধ মাটি থেকে তোলো, ওপরে এক সেকেন্ড থামো।","Lift your shoulders off the floor using your abs, pause for a second at the top."],["ধীরে নামো।","Lower slowly."],["হাত দিয়ে ঘাড় টেনে তোলা","Pulling the neck up with your hands"],["ঝাঁকুনি দিয়ে ওঠা","Jerking up"],["কোমর মাটি থেকে তুলে ফেলা","Lifting the lower back off the floor"],["ওঠার সময় শ্বাস ছাড়ো, নামার সময় নাও।","Breathe out as you rise, breathe in as you lower."],["লেগ রেইজ","Leg raise"],["তলপেট আর কুঁচকির সামনের পেশি শক্ত করে।","Strengthens the lower abs and the front of the hip."],["চিত হয়ে শুয়ে পা সোজা রাখো, হাত দুই পাশে বা নিতম্বের নিচে।","Lie on your back with legs straight, hands at your sides or under your hips."],["কোমর মাটিতে চেপে রেখে পা সোজা করে প্রায় ৯০","Press your lower back into the floor and raise straight legs to about 90"],["পর্যন্ত তোলো।","."],["ধীরে নামাও, পা মাটি ছোঁয়ার আগেই থামো।","Lower slowly and stop before your feet touch the floor."],["কোমর মাটি থেকে উঠে যাওয়া","Lower back coming off the floor"],["পা ধপ করে ফেলা","Dropping the legs with a thud"],["কোমরে ব্যথা পেলে হাঁটু ভাঁজ করে করো।","If your lower back hurts, do it with knees bent."],["ফ্লাটার কিক","Flutter kick"],["তলপেট আর উরুর সামনের পেশি কাজ করে।","Works the lower abs and the front of the thighs."],["চিত হয়ে শুয়ে কোমর মাটিতে চেপে রাখো, হাত নিতম্বের নিচে।","Lie on your back, press your lower back to the floor, hands under your hips."],["দুই পা সোজা রেখে মাটি থেকে প্রায় ১৫ সেমি তোলো।","Keep both legs straight and lift about 15 cm off the floor."],["পা দুটো ছোট করে একটার পর একটা ওঠানামা করাও।","Move your legs up and down in small alternating kicks."],["কোমর বেঁকে ওপরে ওঠা","Arching the back off the floor"],["পা বেশি নিচে নামিয়ে ফেলা","Lowering the legs too far"],["কঠিন লাগলে পা একটু বেশি ওপরে রাখো।","If it is hard, keep the legs a bit higher."],["পুশ-আপ","Push-up"],["বুক, কাঁধ আর বাহুর পেছনের পেশি শক্ত করে; সঙ্গে পেটও কাজ করে।","Strengthens the chest, shoulders and triceps; the abs work too."],["হাত কাঁধের চেয়ে একটু চওড়া করে মাটিতে রাখো, শরীর মাথা থেকে গোড়ালি পর্যন্ত সোজা।","Place your hands slightly wider than your shoulders, body straight from head to heels."],["কনুই ভাঁজ করে বুক মাটির কাছাকাছি নামাও।","Bend your elbows and lower your chest close to the floor."],["বুকের জোরে ঠেলে আগের অবস্থানে ওঠো।","Push through your chest back to the start."],["কোমর ঝুলে পড়া","Letting the hips sag"],["কনুই দুই পাশে একদম চওড়া করে ফেলা","Flaring the elbows out wide"],["অর্ধেক নামা","Going down only halfway"],["কঠিন লাগলে হাঁটু মাটিতে রেখে শুরু করো।","If it is hard, start with your knees on the floor."],["হাঁটু-পুশ-আপ","Knee push-up"],["বুক, বাহু আর কাঁধ শক্ত করে; পুরো পুশ-আপের আগের সহজ ধাপ।","Strengthens the chest, arms and shoulders; an easier step before the full push-up."],["হাঁটু মাটিতে রাখো, হাত কাঁধের নিচে।","Knees on the floor, hands under your shoulders."],["হাঁটু থেকে মাথা পর্যন্ত শরীর সোজা রাখো।","Keep your body straight from knees to head."],["কনুই ভাঁজ করে বুক নামাও, তারপর ঠেলে ওঠো।","Bend your elbows and lower your chest, then push up."],["নিতম্ব ওপরে উঠে যাওয়া","Hips rising up"],["ঘাড় নিচু করে ফেলা","Dropping the neck"],["সহজ হয়ে গেলে ধীরে ধীরে পুরো পুশ-আপে যাও।","When it gets easy, slowly move to the full push-up."],["চেয়ার ডিপস","Chair dips"],["বাহুর পেছনের পেশি, কাঁধ আর বুকের নিচের অংশ শক্ত করে।","Strengthens the triceps, shoulders and lower chest."],["শক্ত চেয়ার বা বেঞ্চের কিনারা পেছনে দুই হাতে ধরো, নিতম্ব সামনে নামিয়ে আনো।","Hold the edge of a sturdy chair or bench behind you with both hands, hips forward off the seat."],["পা সামনে মেলে দাও।","Stretch your legs out in front."],["কনুই পেছনে ভাঁজ করে প্রায় ৯০","Bend your elbows back and lower to about 90"],["পর্যন্ত নামো।","."],["হাতের জোরে ঠেলে ওঠো।","Push up with your arms."],["কাঁধ কানের দিকে তুলে ফেলা","Lifting the shoulders toward the ears"],["নিতম্ব বেঞ্চ থেকে অনেক দূরে নেওয়া","Moving the hips far from the bench"],["কনুই দুই পাশে ছড়িয়ে যাওয়া","Elbows spreading out to the sides"],["চেয়ার যেন না সরে, দেয়ালে ঠেস দিয়ে রাখো। কাঁধে ব্যথা হলে থামো।","Make sure the chair doesn't move, lean it against a wall. Stop if your shoulders hurt."],["পাইক পুশ-আপ","Pike push-up"],["কাঁধ আর বাহুর পেছনের পেশি শক্ত করে।","Strengthens the shoulders and triceps."],["হাত-পা মাটিতে রেখে নিতম্ব ওপরে তুলে উল্টো","Hands and feet on the floor, lift your hips to form an inverted"],["আকৃতি করো।","V shape."],["কনুই ভাঁজ করে মাথা দুই হাতের মাঝে নামাও।","Bend your elbows and lower your head between your hands."],["ঠেলে ওপরে ওঠো।","Push back up."],["পিঠ বেঁকে যাওয়া","Arching the back"],["ঘাড়ে চাপ নিয়ে জোর করা","Forcing it with pressure on the neck"],["ঘাড়ে চাপ লাগলে অর্ধেক নামো।","If you feel pressure on your neck, go down only halfway."],["স্কোয়াট","Squat"],["উরু, নিতম্ব আর কোমরের পেশি শক্ত করে; শরীরের সবচেয়ে কাজের ব্যায়ামগুলোর একটি।","Strengthens the thighs, hips and lower back; one of the most useful exercises for the body."],["পা কাঁধ-সমান চওড়া করে দাঁড়াও।","Stand with feet shoulder-width apart."],["নিতম্ব পেছনে ঠেলে যেন চেয়ারে বসছ, এমনভাবে নামো।","Push your hips back and lower as if sitting on a chair."],["উরু মাটির সমান্তরাল হলে পায়ের তলা দিয়ে ঠেলে ওঠো।","When your thighs are parallel to the floor, push up through your feet."],["হাঁটু ভেতরের দিকে বেঁকে যাওয়া","Knees caving inward"],["গোড়ালি মাটি থেকে ওঠা","Heels lifting off the floor"],["পিঠ গোল হয়ে যাওয়া","Rounding the back"],["হাঁটুতে ব্যথা থাকলে অর্ধেক নামো।","If your knees hurt, go down only halfway."],["লাঞ্জ","Lunge"],["উরু আর নিতম্ব শক্ত করে, ভারসাম্য বাড়ায়। প্রতি পায়ে গোনো।","Strengthens the thighs and hips and improves balance. Count each leg."],["সোজা দাঁড়িয়ে এক পা বড় করে সামনে দাও।","Stand straight and step one foot far forward."],["দুই হাঁটু প্রায় ৯০","Bend both knees to about 90"],["ভাঁজ করে নিচে নামো।","and go down."],["সামনের পায়ের গোড়ালি দিয়ে ঠেলে ফিরে এসো, তারপর অন্য পা।","Push through the front heel to return, then switch legs."],["সামনের হাঁটু পায়ের আঙুল ছাড়িয়ে যাওয়া","Front knee going past the toes"],["শরীর সামনে ঝুঁকে যাওয়া","Leaning forward"],["ভারসাম্য না থাকলে দেয়াল বা চেয়ার ধরো।","If you lack balance, hold a wall or chair."],["সুপারম্যান","Superman"],["পিঠের নিচের অংশ, নিতম্ব আর কাঁধের পেছনের পেশি শক্ত করে।","Strengthens the lower back, hips and the back of the shoulders."],["উপুড় হয়ে শুয়ে হাত সামনে লম্বা করো।","Lie face down with arms stretched forward."],["একসাথে হাত, বুক আর পা মাটি থেকে তোলো।","Lift your arms, chest and legs off the floor together."],["২ সেকেন্ড থেমে ধীরে নামো।","Hold for 2 seconds and lower slowly."],["ঘাড় পেছনে বেশি বাঁকানো","Bending the neck back too much"],["কোমরে ব্যথা হলে শুধু হাত বা শুধু পা তোলো।","If your lower back hurts, lift only your arms or only your legs."],["ডংকি কিক","Donkey kick"],["নিতম্ব আর উরুর পেছনের অংশ টোন করে। প্রতি পায়ে গোনো।","Tones the glutes and the back of the thighs. Count each leg."],["হাত আর হাঁটুর ওপর ভর দিয়ে চার হাত-পায়ে দাঁড়াও।","Get on all fours, supported on hands and knees."],["একটা পা ভাঁজ রেখে পায়ের তলা ছাদের দিকে ঠেলে তোলো।","Keeping one leg bent, push the sole of your foot up toward the ceiling."],["নিতম্ব চেপে ১ সেকেন্ড থেমে নামাও, তারপর অন্য পা।","Squeeze the glute, hold 1 second, lower, then switch legs."],["কোমর বেঁকে ঘুরে যাওয়া","Hips twisting sideways"],["পা অনেক বেশি তোলা","Lifting the leg too high"],["ঝাঁকুনি নয়, ধীরে আর নিয়ন্ত্রণে করো।","No jerking, do it slowly and with control."],["বাইসাইকেল ক্রাঞ্চ","Bicycle crunch"],["পেটের পাশের আর সামনের পেশি একসাথে কাজ করে, ক্যালরিও ভালো পোড়ে। প্রতি পাশে গোনো।","Works the side and front abs together and burns good calories. Count each side."],["চিত হয়ে শুয়ে হাত মাথার পেছনে হালকা রাখো।","Lie on your back with hands lightly behind your head."],["এক হাঁটু বুকের দিকে আনো, অন্য পা সোজা করে মাটির কাছাকাছি রাখো।","Bring one knee toward your chest, keep the other leg straight near the floor."],["উল্টো দিকের কনুই ওই হাঁটুর দিকে ঘোরাও।","Turn the opposite elbow toward that knee."],["সাইকেল চালানোর মতো পা বদলাও।","Switch legs like pedalling a bicycle."],["ঘাড় টেনে ওঠা","Pulling on the neck"],["খুব তাড়াহুড়ো করা","Rushing"],["আস্তে আর নিয়ন্ত্রণে করলেই বেশি কাজ হয়।","Doing it slowly and with control works more."],["দ্রুত হাঁটা","Brisk walking"],["সবচেয়ে সহজ আর নিরাপদ কার্ডিও; নিয়মিত করলে পেটের চর্বিসহ শরীরের চর্বি কমে।","The simplest and safest cardio; done regularly it reduces body fat, including belly fat."],["সোজা হয়ে হাঁটো, কাঁধ শিথিল রাখো।","Walk upright with relaxed shoulders."],["হাত কনুইতে ভাঁজ করে উল্টো পায়ের সঙ্গে দোলাও।","Bend your arms at the elbows and swing them opposite to your legs."],["এমন গতিতে হাঁটো যাতে কথা বলা যায় কিন্তু গান গাওয়া যায় না।","Walk at a pace where you can talk but can't sing."],["ঝুঁকে বা মাথা নিচু করে হাঁটা","Walking hunched or with your head down"],["ছোট ছোট ধীর পা ফেলা","Taking small slow steps"],["প্রতিদিন ৩০ মিনিট লক্ষ্য রাখো, প্রথমে ১০ মিনিট দিয়েই শুরু করো।","Aim for 30 minutes a day, start with just 10 minutes."],["বার্পি","Burpee"],["পুরো শরীর একসাথে খাটে, কম সময়ে অনেক ক্যালরি পোড়ে।","Works the whole body at once and burns a lot of calories in little time."],["দাঁড়ানো থেকে নিচে বসে হাত মাটিতে রাখো।","From standing, squat down and place your hands on the floor."],["পা পেছনে দিয়ে প্ল্যাঙ্ক অবস্থানে যাও।","Kick your feet back into a plank position."],["পা টেনে এনে লাফ দিয়ে ওপরে হাত তোলো।","Pull your feet in and jump up with arms overhead."],["কোমর ঝুলে যাওয়া","Hips sagging"],["শক্ত হাঁটুতে নামা","Landing on stiff knees"],["কঠিন মনে হলে লাফ বাদ দিয়ে শুধু উঠে দাঁড়াও।","If it feels hard, skip the jump and just stand up."],["হাই নিজ","High knees"],["হৃৎপিণ্ডের গতি বাড়ায়, ক্যালরি পোড়ায়; উরু আর পেট কাজ করে।","Raises the heart rate and burns calories; the thighs and abs work."],["সোজা দাঁড়াও।","Stand straight."],["জায়গায় দাঁড়িয়ে দ্রুত একটার পর একটা হাঁটু কোমর পর্যন্ত তোলো।","Standing in place, quickly raise one knee after another to hip height."],["হাত উল্টো দিকে দোলাও।","Swing your arms in opposition."],["পিঠ পেছনে হেলে যাওয়া","Leaning the back backward"],["গোড়ালি ধপধপ করে ফেলা","Stamping the heels"],["আস্তে শুরু করো, হাঁপিয়ে গেলে থামো।","Start slowly, stop if you get out of breath."],["জাম্প স্কোয়াট","Jump squat"],["পায়ের জোর আর ক্যালরি পোড়ানো একসাথে বাড়ায়।","Builds leg power and calorie burn together."],["স্কোয়াটের মতো নিচে নামো।","Lower down like a squat."],["জোরে ওপরে লাফ দাও, হাত ওপরে।","Jump up hard with your arms overhead."],["নরম হাঁটুতে নামো, সঙ্গে সঙ্গে আবার স্কোয়াট।","Land on soft knees and go straight into the next squat."],["হাঁটু ভেতরে ঢুকে যাওয়া","Knees caving inward"],["হাঁটু বা গোড়ালিতে সমস্যা থাকলে এটা বাদ দিয়ে সাধারণ স্কোয়াট করো।","If you have knee or ankle problems, skip this and do a normal squat."],["জাম্পিং জ্যাক","Jumping jacks"],["পুরো শরীরের হালকা কার্ডিও, শুরু করার জন্য সহজ।","Light full-body cardio, easy to start with."],["পা জোড়া করে সোজা দাঁড়াও, হাত দুই পাশে।","Stand straight with feet together, hands at your sides."],["লাফিয়ে দুই পা ছড়াও আর হাত মাথার ওপরে তোলো।","Jump your feet apart and raise your hands over your head."],["আবার লাফিয়ে আগের অবস্থায় ফেরো।","Jump back to the starting position."],["শক্ত পায়ে লাফানো","Landing on stiff legs"],["ছন্দ ভেঙে ফেলা","Losing the rhythm"],["নরম জুতো আর সমতল জায়গা নাও।","Wear soft shoes and use a flat surface."],["মাউন্টেইন ক্লাইম্বার","Mountain climber"],["পেট, কাঁধ আর পায়ের কার্ডিও; চর্বি ঝরাতে ভালো।","Cardio for the abs, shoulders and legs; good for burning fat."],["পুশ-আপের অবস্থানে হাত সোজা রাখো।","Keep your arms straight in a push-up position."],["এক হাঁটু বুকের কাছে আনো।","Bring one knee toward your chest."],["দ্রুত পা বদলাও, যেন দৌড়াচ্ছ।","Switch legs quickly, as if running."],["নিতম্ব ওপরে তুলে ফেলা","Lifting the hips up"],["হাত কাঁধের নিচ থেকে সরে যাওয়া","Hands moving away from under the shoulders"],["কেগেল (পেলভিক ফ্লোর)","Kegel (pelvic floor)"],["নিতম্বের নিচের যে পেশি মূত্র আটকায় সেটা শক্ত করে। এতে মূত্র নিয়ন্ত্রণ ভালো হয় এবং যৌন সুস্থতায়ও সহায়ক বলে গবেষণায় ইঙ্গিত আছে।","Strengthens the muscle under the pelvis that stops urine flow. Improves bladder control, and research suggests it may help sexual wellbeing too."],["পেলভিক ফ্লোরের পেশি শক্ত করে; মূত্র নিয়ন্ত্রণ, প্রসব-পরবর্তী সুস্থতা আর যৌন সুস্থতায় উপকারী।","Strengthens the pelvic floor muscles; helps bladder control, postpartum recovery and sexual wellbeing."],["প্রথমে পেশিটা চিনে নাও: প্রস্রাব আটকানোর সময় যে পেশি কাজ করে, সেটাই (শুধু চেনার জন্য, অভ্যাস করার জন্য নয়)।","First identify the muscle: it is the one that works when you hold back urine (only to identify it, not to practise)."],["আরাম করে চিত হয়ে শুয়ে ওই পেশি ভেতরের দিকে ওপরে টানো।","Lie on your back comfortably and pull that muscle inward and upward."],["৩–৫ সেকেন্ড ধরে রাখো, তারপর পুরো ছাড়ো। প্রতিটা এক বার গোনো।","Hold for 3-5 seconds, then release fully. Count each as one."],["পেট, নিতম্ব আর উরু শিথিল রেখে স্বাভাবিক শ্বাস চালিয়ে যাও।","Keep your belly, hips and thighs relaxed and keep breathing normally."],["পেট, নিতম্ব বা উরু চেপে ফেলা","Squeezing the belly, hips or thighs"],["প্রস্রাবের মাঝখানে নিয়মিত থামানোর অভ্যাস করা","Making a habit of stopping midstream while urinating"],["ব্যথা, প্রস্রাবে সমস্যা বা যৌন সমস্যা টানা থাকলে ডাক্তারের পরামর্শ নাও।","If you have pain, urinary problems or persistent sexual problems, see a doctor."],["গ্লুট ব্রিজ","Glute bridge"],["নিতম্ব, কোমর আর পেলভিক অঞ্চলের পেশি শক্ত করে এবং ওই অঞ্চলে রক্তচলাচল সচল রাখে।","Strengthens the hips, lower back and pelvic muscles and keeps blood flowing in that area."],["নিতম্ব আর উরুর পেছনের অংশ টোন করে এবং পেলভিক ফ্লোরকে সাপোর্ট দেয়।","Tones the hips and the back of the thighs and supports the pelvic floor."],["চিত হয়ে শুয়ে হাঁটু ভাঁজ করো, পায়ের তলা মাটিতে।","Lie on your back with knees bent and feet flat on the floor."],["নিতম্ব চেপে ওপরে তোলো, যেন কাঁধ থেকে হাঁটু পর্যন্ত সোজা লাইন হয়।","Squeeze your hips and lift them until there is a straight line from shoulders to knees."],["ওপরে ২ সেকেন্ড থেমে ধীরে নামো।","Hold 2 seconds at the top and lower slowly."],["কোমর বেশি বাঁকিয়ে তোলা","Arching the lower back too much"],["গভীর স্কোয়াট (মালাসন)","Deep squat (Malasana)"],["কুঁচকি, নিতম্ব আর পেলভিক অঞ্চলের পেশি নমনীয় করে।","Makes the groin, hip and pelvic muscles more flexible."],["নিতম্ব ও পেলভিক অঞ্চল খুলে দেয়, পেলভিক ফ্লোর শিথিল রাখতে সাহায্য করে।","Opens the hips and pelvis and helps keep the pelvic floor relaxed."],["পা কাঁধের চেয়ে একটু চওড়া করো, আঙুল সামান্য বাইরের দিকে।","Feet slightly wider than your shoulders, toes turned slightly out."],["নিতম্ব নিচে নামিয়ে গভীর স্কোয়াটে বসো, দুই হাত বুকের সামনে জোড়া।","Lower your hips into a deep squat with palms together in front of your chest."],["কনুই দিয়ে হাঁটু আলতো ঠেলে ৩০ সেকেন্ড থাকো।","Gently press your knees out with your elbows and stay for 30 seconds."],["ধীরে ওঠো।","Rise slowly."],["গোড়ালি ওঠা","Heels lifting"],["পিঠ গোল করা","Rounding the back"],["গোড়ালি উঠে গেলে নিচে ভাঁজ করা তোয়ালে দাও। হাঁটুতে ব্যথা থাকলে এটা বাদ দাও।","If your heels lift, put a folded towel under them. Skip this if your knees hurt."],["পেটের গভীর শ্বাস","Deep belly breathing"],["মানসিক চাপ আর উদ্বেগ কমায়; চাপ কমলে যৌন সুস্থতায়ও ভালো প্রভাব পড়ে।","Reduces stress and anxiety; lower stress also has a good effect on sexual wellbeing."],["আরাম করে সোজা বসো, এক হাত পেটে রাখো।","Sit up comfortably with one hand on your belly."],["নাক দিয়ে ৪ সেকেন্ডে শ্বাস নাও, পেট ফুলুক।","Breathe in through the nose for 4 seconds and let the belly rise."],["মুখ দিয়ে ৬ সেকেন্ডে আস্তে ছাড়ো।","Breathe out slowly through the mouth for 6 seconds."],["কাঁধ ওপরে তুলে শ্বাস নেওয়া","Lifting the shoulders as you inhale"],["জোর করে টেনে নেওয়া","Forcing the breath in"],["মাথা ঘুরলে স্বাভাবিক শ্বাসে ফিরে যাও।","If you feel dizzy, return to normal breathing."],["শ্বাস নাও, পেট ফোলাও","Breathe in, let the belly rise"],["হ্যাপি বেবি","Happy baby"],["কুঁচকি, নিতম্ব আর কোমর শিথিল করে, পেলভিক ফ্লোর আরামে রাখে।","Relaxes the groin, hips and lower back and keeps the pelvic floor comfortable."],["চিত হয়ে শুয়ে হাঁটু বুকের দুই পাশে টেনে আনো।","Lie on your back and draw your knees toward the sides of your chest."],["পায়ের বাইরের পাশ বা গোড়ালি ধরো।","Hold the outer edges of your feet or your heels."],["হাঁটু বগলের দিকে আলতো টেনে ৩০ সেকেন্ড থাকো, শ্বাস চলুক।","Gently pull the knees toward the armpits and stay 30 seconds, keep breathing."],["কাঁধ বা ঘাড় মাটি থেকে তুলে ফেলা","Lifting the shoulders or neck off the floor"],["জোর করে টানা","Pulling forcefully"],["ক্যাট-কাউ","Cat-Cow"],["মেরুদণ্ড নমনীয় করে, পিঠ আর ঘাড়ের টান কমায়।","Makes the spine flexible and eases tension in the back and neck."],["চার হাত-পায়ে ওঠো, হাত কাঁধের নিচে, হাঁটু নিতম্বের নিচে।","Get on all fours, hands under shoulders, knees under hips."],["শ্বাস নিয়ে পিঠ নিচে, মাথা ওপরে (কাউ)।","Breathe in, back down and head up (Cow)."],["শ্বাস ছেড়ে পিঠ ওপরে গোল করে, মাথা নিচে (ক্যাট)।","Breathe out, round the back up and head down (Cat)."],["ঝাঁকুনি দিয়ে করা","Doing it with jerks"],["কনুই ভাঁজ করে ফেলা","Bending the elbows"],["চাইল্ডস পোজ","Child's pose"],["পিঠ, কোমর আর কাঁধ শিথিল করে, মন শান্ত করে।","Relaxes the back, hips and shoulders and calms the mind."],["হাঁটু গেড়ে বসো, নিতম্ব গোড়ালির দিকে নামাও।","Kneel and lower your hips toward your heels."],["কপাল মাটিতে রেখে হাত সামনে লম্বা করো।","Rest your forehead on the floor and stretch your arms forward."],["গভীর শ্বাস নিয়ে ৩০–৬০ সেকেন্ড থাকো।","Take deep breaths and stay 30-60 seconds."],["হাঁটুতে ব্যথা নিয়ে জোর করা","Forcing it with knee pain"],["ঘাড় শক্ত করে রাখা","Keeping the neck stiff"],["ভুজঙ্গাসন (কোবরা)","Bhujangasana (Cobra)"],["পেট আর বুক প্রসারিত করে, পিঠের পেশি শক্ত করে, ভঙ্গি ঠিক রাখে।","Stretches the abdomen and chest, strengthens the back muscles and keeps posture right."],["উপুড় হয়ে শুয়ে হাত বুকের পাশে রাখো।","Lie face down with hands beside your chest."],["ধীরে বুক তোলো, নিতম্ব আর পা মাটিতে থাকবে।","Slowly lift your chest; hips and legs stay on the floor."],["১৫–২০ সেকেন্ড ধরে রাখো, শ্বাস চলুক।","Hold 15-20 seconds, keep breathing."],["কাঁধ কানের কাছে তোলা","Lifting the shoulders toward the ears"],["কোমরে ব্যথা থাকলে বা গর্ভাবস্থায় ডাক্তারের পরামর্শ ছাড়া করো না।","Do not do this with lower back pain or during pregnancy without a doctor's advice."],["বাটারফ্লাই স্ট্রেচ","Butterfly stretch"],["কুঁচকি আর ভেতরের উরু নমনীয় করে, নিতম্ব খোলে।","Makes the groin and inner thighs flexible and opens the hips."],["বসে দুই পায়ের তলা জোড়া করো।","Sit and bring the soles of your feet together."],["হাঁটু দুই পাশে আস্তে নামতে দাও।","Let your knees drop gently to the sides."],["পিঠ সোজা রেখে সামনে ঝুঁকে ৩০ সেকেন্ড থাকো।","Keep your back straight, lean forward and stay 30 seconds."],["হাত দিয়ে হাঁটু ঠেলে নামানো","Pushing the knees down with your hands"],["পিঠ বেঁকে ফেলা","Rounding the back"],["বার","times"],["পুরুষ","Male"],["টা ব্যায়াম"," exercises"],["নারী","Female"],["যেকোনো একটা বেছে নাও, পরে যখন খুশি বদলাতে পারবে। ছবিগুলো এই অ্যাপের নিজের আঁকা সরল চিত্র।","Pick any one, you can change it whenever you like. The figures are simple illustrations drawn for this app."],["সেট আজ","sets today"],["টা ব্যায়ামের লক্ষ্য পূরণ"," exercise goals reached"],["সব","All"],["· § সেট","· {} sets"],["সত্যি কথাটা","The honest truth"],["শুধু পেটের ব্যায়ামে পেটের চর্বি আলাদা করে কমে না; পুরো শরীরের চর্বি কমলে পেটেরটাও কমে। তাই হাঁটা বা কার্ডিও, পেটের ব্যায়াম, চিনি আর ভাজাপোড়া কম খাওয়া, পর্যাপ্ত পানি ও ঘুম, সব একসাথে চালাও। ফল পেতে সাধারণত কয়েক সপ্তাহ লাগে।","Belly exercises alone do not burn belly fat in particular; belly fat goes down when whole-body fat goes down. So combine walking or cardio, belly exercises, less sugar and fried food, e   hard: [
    ['فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا', 'নিশ্চয়ই কষ্টের সাথে স্বস্তি আছে। নিশ্চয়ই কষ্টের সাথে স্বস্তি আছে।', 'Indeed, with hardship comes ease. Indeed, with hardship comes ease.', '94:5-6'],
    ['يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ', 'হে মুমিনগণ, ধৈর্য আর নামাজের মাধ্যমে সাহায্য চাও। নিশ্চয়ই আল্লাহ ধৈর্যশীলদের সাথে আছেন।', 'O you who believe, seek help through patience and prayer. Indeed, Allah is with the patient.', '2:153'],
    ['لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا', 'আল্লাহ কোনো মানুষের ওপর তার সাধ্যের বাইরে বোঝা চাপান না।', 'Allah does not burden a soul beyond its capacity.', '2:286'],
    ['وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ', 'হতে পারে তোমরা কোনো কিছু অপছন্দ করো অথচ সেটাই তোমাদের জন্য ভালো। আর হতে পারে কোনো কিছু পছন্দ করো অথচ সেটা তোমাদের জন্য খারাপ। আল্লাহ জানেন, তোমরা জানো না।', 'It may be that you dislike something while it is good for you, and it may be that you love something while it is bad for you. Allah knows and you do not know.', '2:216'],
    ['الَّذِينَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ قَالُوا إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ', 'যারা বিপদে পড়লে বলে, “আমরা তো আল্লাহরই, আর আমরা তাঁরই কাছে ফিরে যাব।”', 'Those who, when disaster strikes them, say: “Indeed we belong to Allah, and indeed to Him we will return.”', '2:156'],
    ['قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا', 'বলো, “হে আমার বান্দারা, যারা নিজেদের ওপর বাড়াবাড়ি করেছ, আল্লাহর রহমত থেকে নিরাশ হয়ো না। নিশ্চয়ই আল্লাহ সব গুনাহ ক্ষমা করেন।”', 'Say: “O My servants who have wronged themselves, do not despair of Allah’s mercy. Indeed, Allah forgives all sins.”', '39:53'],
    ['وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ۝ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ', 'যে আল্লাহকে ভয় করে, তিনি তার জন্য বের হওয়ার পথ করে দেন, আর এমন জায়গা থেকে রিযিক দেন যা সে কল্পনাও করেনি। যে আল্লাহর ওপর ভরসা করে, তার জন্য তিনিই যথেষ্ট।', 'Whoever fears Allah, He makes a way out for him and provides for him from where he does not expect. Whoever relies on Allah, He is sufficient for him.', '65:2-3'],
    ['أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ', 'জেনে রাখো, আল্লাহর স্মরণেই অন্তর প্রশান্ত হয়।', 'Surely, in the remembrance of Allah hearts find peace.', '13:28'],
    ['وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ', 'তোমরা দুর্বল হয়ো না, দুঃখ করো না। তোমরাই বিজয়ী, যদি তোমরা মুমিন হও।', 'Do not weaken and do not grieve, for you will be superior if you are believers.', '3:139'],
    ['لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ', 'আপনি ছাড়া কোনো ইলাহ নেই, আপনি পবিত্র। নিশ্চয়ই আমি যালিমদের অন্তর্ভুক্ত ছিলাম। (ইউনুস আ.-এর দুআ)', 'There is no god but You, glory be to You. Indeed, I was among the wrongdoers. (The dua of Prophet Yunus)', '21:87'],
    ['قُل لَّن يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَانَا ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ', 'বলো, “আল্লাহ আমাদের জন্য যা লিখে রেখেছেন, তা ছাড়া কিছুই আমাদের ওপর আসবে না। তিনিই আমাদের অভিভাবক।” মুমিনরা যেন আল্লাহর ওপরই ভরসা করে।', 'Say: “Nothing will ever befall us except what Allah has decreed for us. He is our Protector.” Let the believers rely on Allah.', '9:51'],
    ['مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ ۝ وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ ۝ وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ', 'তোমার রব তোমাকে ছেড়ে যাননি, অসন্তুষ্টও হননি। তোমার জন্য পরের জীবন এই জীবনের চেয়ে ভালো। আর শীঘ্রই তোমার রব তোমাকে এত দেবেন যে তুমি খুশি হয়ে যাবে।', 'Your Lord has not abandoned you, nor is He displeased. The Hereafter is better for you than this life, and your Lord will soon give you so much that you will be pleased.', '93:3-5']
  ],
  joy: [
    ['لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ', 'যদি তোমরা কৃতজ্ঞ হও, তবে অবশ্যই আমি তোমাদের আরও বাড়িয়ে দেব।', 'If you are grateful, I will surely increase you.', '14:7'],
    ['فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ', 'তোমরা আমাকে স্মরণ করো, আমিও তোমাদের স্মরণ করব। আমার শুকরিয়া আদায় করো, অকৃতজ্ঞ হয়ো না।', 'So remember Me; I will remember you. Be grateful to Me and do not be ungrateful.', '2:152'],
    ['هَٰذَا مِن فَضْلِ رَبِّي لِيَبْلُوَنِي أَأَشْكُرُ أَمْ أَكْفُرُ', 'এ আমার রবের অনুগ্রহ, তিনি আমাকে পরীক্ষা করছেন আমি কৃতজ্ঞ হই, না অকৃতজ্ঞ। (সুলাইমান আ.)', 'This is from the favour of my Lord, to test whether I am grateful or ungrateful. (Prophet Sulayman)', '27:40'],
    ['قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا', 'বলো, আল্লাহর অনুগ্রহ ও রহমতে, তাতেই তারা আনন্দ করুক।', 'Say: In the bounty of Allah and in His mercy, in that let them rejoice.', '10:58'],
    ['وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا ۗ إِنَّ اللَّهَ لَغَفُورٌ رَّحِيمٌ', 'আল্লাহর নিয়ামত গুনতে চাইলে শেষ করতে পারবে না। নিশ্চয়ই আল্লাহ ক্ষমাশীল, দয়ালু।', 'If you tried to count Allah’s blessings, you could not. Indeed, Allah is Forgiving and Merciful.', '16:18'],
    ['وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ', 'আর তোমার রবের নিয়ামতের কথা বলো (শুকরিয়া জানাও)।', 'And as for the blessing of your Lord, speak of it.', '93:11'],
    ['وَمَن يَشْكُرْ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ', 'যে কৃতজ্ঞ হয়, সে নিজের কল্যাণের জন্যই কৃতজ্ঞ হয়।', 'Whoever is grateful, is grateful only for his own good.', '31:12'],
    ['وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ', 'আল্লাহ তোমাকে যা দিয়েছেন তা দিয়ে আখিরাত খোঁজো, দুনিয়ার অংশও ভুলে যেয়ো না। আল্লাহ যেমন তোমার প্রতি ভালো করেছেন, তুমিও অন্যের প্রতি ভালো করো।', 'Seek the Hereafter through what Allah has given you, and do not forget your share of this world. Be good to others as Allah has been good to you.', '28:77']
  ],
  mot: [
    ['إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ', 'আল্লাহ কোনো জাতির অবস্থা বদলান না, যতক্ষণ না তারা নিজেরা নিজেদের অবস্থা বদলায়।', 'Allah does not change the condition of a people until they change what is within themselves.', '13:11'],
    ['وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ', 'মানুষ তা-ই পায়, যার জন্য সে চেষ্টা করে।', 'Man will have only what he strives for.', '53:39'],
    ['وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا', 'যারা আমার পথে চেষ্টা করে, আমি অবশ্যই তাদের আমার পথ দেখিয়ে দেব।', 'Those who strive for Us, We will surely guide them to Our ways.', '29:69'],
    ['فَإِذَا فَرَغْتَ فَانصَبْ ۝ وَإِلَىٰ رَبِّكَ فَارْغَب', 'অতএব কাজ শেষ হলে আবার পরিশ্রম করো, আর তোমার রবের প্রতিই মনোযোগী হও।', 'So when you have finished, strive on, and turn your longing to your Lord.', '94:7-8'],
    ['فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ', 'সিদ্ধান্ত নিয়ে ফেললে আল্লাহর ওপর ভরসা করো। নিশ্চয়ই আল্লাহ ভরসাকারীদের ভালোবাসেন।', 'Once you have decided, put your trust in Allah. Indeed, Allah loves those who trust in Him.', '3:159'],
    ['إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ', 'ধৈর্যশীলদের প্রতিদান দেওয়া হবে বেহিসাব।', 'The patient will be given their reward without measure.', '39:10'],
    ['رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي', 'হে আমার রব, আমার বুক প্রশস্ত করে দিন আর আমার কাজ সহজ করে দিন।', 'My Lord, expand my chest for me and make my task easy for me.', '20:25-26'],
    ['إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا', 'যে ভালোভাবে কাজ করে, আমি তার প্রতিদান নষ্ট করি না।', 'Indeed, We do not let the reward of those who do good deeds go to waste.', '18:30']
  ],
  day: [
    ['وَقُولُوا لِلنَّاسِ حُسْنًا', 'মানুষের সাথে ভালো কথা বলো।', 'And speak to people good words.', '2:83'],
    ['وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا', 'তোমার রব আদেশ দিয়েছেন, তাঁকে ছাড়া কারো ইবাদত করো না, আর বাবা-মায়ের সাথে ভালো ব্যবহার করো।', 'Your Lord has decreed that you worship none but Him, and that you be good to your parents.', '17:23'],
    ['إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ', 'নিশ্চয়ই আল্লাহ ন্যায়বিচার, দয়া আর আত্মীয়দের হক আদায়ের আদেশ দেন।', 'Indeed, Allah commands justice, kindness and giving to relatives.', '16:90'],
    ['وَلَا تَجَسَّسُوا وَلَا يَغْتَب بَّعْضُكُم بَعْضًا', 'আর তোমরা একে অপরের দোষ খুঁজো না, একে অপরের গিবত করো না।', 'And do not spy, and do not backbite one another.', '49:12'],
    ['وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا', 'প্রতিশ্রুতি পূরণ করো। প্রতিশ্রুতি সম্পর্কে অবশ্যই জিজ্ঞাসা করা হবে।', 'Fulfil the promise. Indeed, the promise will be questioned about.', '17:34'],
    ['وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ', 'খাও, পান করো, কিন্তু অপচয় করো না। অপচয়কারীদের আল্লাহ ভালোবাসেন না।', 'Eat and drink, but do not waste. Indeed, He does not like the wasteful.', '7:31'],
    ['فَإِذَا قُضِيَتِ الصَّلَاةُ فَانتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِن فَضْلِ اللَّهِ وَاذْكُرُوا اللَّهَ كَثِيرًا لَّعَلَّكُمْ تُفْلِحُونَ', 'নামাজ শেষ হলে জমিনে ছড়িয়ে পড়ো, আল্লাহর অনুগ্রহ (রিযিক) খোঁজো আর বেশি বেশি আল্লাহকে স্মরণ করো, যাতে সফল হও।', 'When the prayer is finished, disperse in the land, seek Allah’s bounty and remember Allah often, so that you may succeed.', '62:10'],

    ['সকালে (সূর্য ওঠার আগে ও পরে)', 'Morning (around sunrise)', 'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ', 'আল্লা-হুম্মা বিকা আসবাহনা ওয়া বিকা আমসাইনা ওয়া বিকা নাহইয়া ওয়া বিকা নামূতু ওয়া ইলাইকান নুশূর।', 'Allahumma bika asbahna wa bika amsayna wa bika nahya wa bika namutu wa ilaykan-nushur.', 'হে আল্লাহ, আপনার দয়াতেই আমরা সকাল করলাম, আপনার দয়াতেই সন্ধ্যা করলাম, আপনার দয়াতেই বাঁচি, আপনার ইচ্ছায় মরি, আর আপনার কাছেই ফিরে যাব।', 'O Allah, by You we reach the morning and by You we reach the evening, by You we live and die, and to You is the resurrection.', 'T'],
    ['সকালের কৃতজ্ঞতা', 'Morning gratitude', 'اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ', 'আল্লা-হুম্মা মা আসবাহা বী মিন নি’মাতিন আও বি-আহাদিম মিন খালক্বিকা ফামিনকা ওয়াহদাকা লা শারীকা লাকা, ফালাকাল হামদু ওয়ালাকাশ শুকর।', 'Allahumma ma asbaha bi min ni‘matin aw bi-ahadin min khalqika faminka wahdaka la sharika laka, falakal-hamdu wa lakash-shukr.', 'হে আল্লাহ, আজ সকালে আমি বা আপনার সৃষ্টির কেউ যে নিয়ামত পেয়েছে, তা কেবল আপনারই পক্ষ থেকে, আপনার কোনো শরিক নেই। সব প্রশংসা আর কৃতজ্ঞতা আপনারই।', 'O Allah, whatever blessing I or any of Your creation has this morning is from You alone, You have no partner. All praise and thanks are Yours.', 'AD5073'],
    ['সাইয়্যিদুল ইস্তিগফার', 'Sayyidul Istighfar (master of forgiveness)', 'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ', 'আল্লা-হুম্মা আনতা রব্বী লা ইলা-হা ইল্লা আনতা, খালাক্বতানী ওয়া আনা ‘আবদুকা, ওয়া আনা ‘আলা ‘আহদিকা ওয়া ওয়া’দিকা মাসতাত্বা’তু, আ’ঊযু বিকা মিন শাররি মা সানা’তু, আবূউ লাকা বিনি’মাতিকা ‘আলাইয়া, ওয়া আবূউ বিযাম্বী ফাগফিরলী ফাইন্নাহূ লা ইয়াগফিরুয যুনূবা ইল্লা আনতা।', 'Allahumma anta Rabbi la ilaha illa ant, khalaqtani wa ana ‘abduk, wa ana ‘ala ‘ahdika wa wa‘dika mastata‘t, a‘udhu bika min sharri ma sana‘t, abu’u laka bini‘matika ‘alayya, wa abu’u bidhanbi faghfir li fa innahu la yaghfirudh-dhunuba illa ant.', 'হে আল্লাহ, আপনি আমার রব, আপনি ছাড়া কোনো ইলাহ নেই। আপনি আমাকে সৃষ্টি করেছেন, আমি আপনার বান্দা। সাধ্যমতো আপনার অঙ্গীকারে আছি। আমার কাজের অনিষ্ট থেকে আশ্রয় চাই। আমার ওপর আপনার নিয়ামত স্বীকার করছি, আমার গুনাহও স্বীকার করছি। আমাকে ক্ষমা করুন, আপনি ছাড়া কেউ গুনাহ ক্ষমা করে না।', 'O Allah, You are my Lord, there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.', 'B6306'],
    ['নিরাপত্তার দুআ (৩ বার)', 'Dua for protection (3 times)', 'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ', 'বিসমিল্লা-হিল্লাযী লা ইয়াদুররু মা’আসমিহী শাইউন ফিল আরদ্বি ওয়ালা ফিস সামা-ই ওয়া হুওয়াস সামী’উল ‘আলীম।', 'Bismillahil-ladhi la yadurru ma‘asmihi shay’un fil-ardi wa la fis-sama’i wa huwas-sami‘ul-‘alim.', 'আল্লাহর নামে, যাঁর নামের সাথে আসমান ও জমিনের কোনো কিছুই ক্ষতি করতে পারে না। তিনি সব শোনেন, সব জানেন।', 'In the name of Allah, with whose name nothing on earth or in heaven can harm. He is the All-Hearing, All-Knowing.', 'AD'],
    ['সুস্থতার দুআ (৩ বার)', 'Dua for wellbeing (3 times)', 'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ', 'আল্লা-হুম্মা ‘আফিনী ফী বাদানী, আল্লা-হুম্মা ‘আফিনী ফী সাম’ঈ, আল্লা-হুম্মা ‘আফিনী ফী বাসারী, লা ইলা-হা ইল্লা আনতা।', 'Allahumma ‘afini fi badani, Allahumma ‘afini fi sam‘i, Allahumma ‘afini fi basari, la ilaha illa ant.', 'হে আল্লাহ, আমার শরীরে, শ্রবণে ও দৃষ্টিতে আমাকে সুস্থ রাখুন। আপনি ছাড়া কোনো ইলাহ নেই।', 'O Allah, grant me health in my body, my hearing and my sight. There is no god but You.', 'AD5090'],
    ['সুবহানাল্লাহি ওয়া বিহামদিহী (১০০ বার)', 'Subhanallahi wa bihamdihi (100 times)', 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', 'সুবহা-নাল্লা-হি ওয়া বিহামদিহী।', 'Subhanallahi wa bihamdih.', 'আল্লাহ পবিত্র, আর সব প্রশংসা তাঁর। যে দিনে একশ বার বলে, তার গুনাহ সমুদ্রের ফেনার সমান হলেও মাফ হয়ে যায়।', 'Glory and praise be to Allah. Whoever says it 100 times a day, his sins are forgiven even if they are like the foam of the sea.', 'B6405'],
    ['আল্লাহকে রব মেনে নেওয়ার ঘোষণা (৩ বার)', 'Declaring Allah as Lord (3 times)', 'رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ ﷺ نَبِيًّا', 'রাদ্বীতু বিল্লা-হি রব্বান, ওয়া বিল ইসলা-মি দীনান, ওয়া বিমুহাম্মাদিন নাবিইয়্যা।', 'Raditu billahi Rabban, wa bil-Islami dinan, wa bi-Muhammadin nabiyya.', 'আমি আল্লাহকে রব, ইসলামকে দ্বীন আর মুহাম্মাদ ﷺ-কে নবী হিসেবে মেনে নিয়ে সন্তুষ্ট।', 'I am pleased with Allah as Lord, Islam as religion, and Muhammad ﷺ as Prophet.', 'AD'],
    ['পড়াশোনা ও কাজের আগে', 'Before study or work', 'رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي ۝ رَبِّ زِدْنِي عِلْمًا', 'রব্বিশরাহ লী সাদরী, ওয়া ইয়াসসির লী আমরী। রব্বি যিদনী ‘ইলমা।', 'Rabbish-rahli sadri, wa yassir li amri. Rabbi zidni ‘ilma.', 'হে আমার রব, আমার অন্তর খুলে দিন, আমার কাজ সহজ করে দিন। হে আমার রব, আমার জ্ঞান বাড়িয়ে দিন।', 'My Lord, expand my chest and ease my task. My Lord, increase me in knowledge.', 'Q20:25-26,114']
  ]],
  ['out', 'ঘর, মসজিদ আর খাবার', 'Home, mosque and food', [
    ['ঘর থেকে বের হওয়ার সময়', 'When leaving home', 'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', 'বিসমিল্লা-হি তাওয়াক্কালতু ‘আলাল্লা-হি ওয়া লা হাওলা ওয়া লা কুওওয়াতা ইল্লা বিল্লা-হ।', 'Bismillahi tawakkaltu ‘alallahi wa la hawla wa la quwwata illa billah.', 'আল্লাহর নামে, আল্লাহর ওপর ভরসা করলাম। আল্লাহ ছাড়া কোনো উপায় বা শক্তি নেই।', 'In the name of Allah, I trust in Allah. There is no might or power except with Allah.', 'AD'],
    ['ঘরে ঢোকার সময়', 'When entering home', 'بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا', 'বিসমিল্লা-হি ওয়ালাজনা, ওয়া বিসমিল্লা-হি খারাজনা, ওয়া ‘আলাল্লা-হি রব্বিনা তাওয়াক্কালনা।', 'Bismillahi walajna, wa bismillahi kharajna, wa ‘alallahi Rabbina tawakkalna.', 'আল্লাহর নামে ঢুকলাম, আল্লাহর নামে বের হলাম, আমাদের রব আল্লাহর ওপরই ভরসা করলাম। (তারপর পরিবারকে সালাম দাও)', 'In the name of Allah we enter, in the name of Allah we leave, and upon Allah our Lord we rely. (Then greet your family with salam)', 'AD'],
    ['মসজিদে ঢোকার সময়', 'When entering the mosque', 'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ', 'আল্লা-হুম্মাফতাহ লী আবওয়া-বা রাহমাতিক।', 'Allahummaftah li abwaba rahmatik.', 'হে আল্লাহ, আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন। (ডান পা আগে দাও)', 'O Allah, open for me the doors of Your mercy. (Enter with your right foot)', 'M713'],
    ['মসজিদ থেকে বের হওয়ার সময়', 'When leaving the mosque', 'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ', 'আল্লা-হুম্মা ইন্নী আসআলুকা মিন ফাদ্বলিক।', 'Allahumma inni as’aluka min fadlik.', 'হে আল্লাহ, আমি আপনার অনুগ্রহ চাই। (বাম পা আগে দাও)', 'O Allah, I ask You for Your bounty. (Leave with your left foot)', 'M713'],
    ['খাওয়ার আগে', 'Before eating', 'بِسْمِ اللَّهِ', 'বিসমিল্লা-হ। (শুরুতে ভুলে গেলে: বিসমিল্লা-হি আউওয়ালাহূ ওয়া আ-খিরাহ)', 'Bismillah. (If you forget at the start: Bismillahi awwalahu wa akhirah)', 'আল্লাহর নামে। ডান হাতে খাও, নিজের সামনে থেকে খাও।', 'In the name of Allah. Eat with your right hand, from what is in front of you.', 'B5376'],
    ['খাওয়ার পরে', 'After eating', 'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ', 'আলহামদু লিল্লা-হিল্লাযী আত্বআমানী হাযা ওয়া রাযাক্বানীহি মিন গাইরি হাওলিম মিন্নী ওয়ালা কুওওয়াহ।', 'Alhamdu lillahil-ladhi at‘amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah.', 'সব প্রশংসা আল্লাহর, যিনি আমাকে এটা খাওয়ালেন, আমার কোনো চেষ্টা বা শক্তি ছাড়াই রিযিক দিলেন। (এতে পূর্বের গুনাহ মাফ হয়)', 'All praise is for Allah who fed me this and provided it without any power or ability from me. (Previous sins are forgiven)', 'AD'],
    ['বাহনে ওঠার দুআ', 'When boarding a vehicle', 'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ', 'সুবহা-নাল্লাযী সাখখারা লানা হা-যা ওয়া মা কুন্না লাহূ মুক্বরিনীন। ওয়া ইন্না ইলা-রব্বিনা লামুনক্বালিবূন।', 'Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin. Wa inna ila Rabbina lamunqalibun.', 'পবিত্র তিনি, যিনি এটাকে আমাদের বশীভূত করে দিয়েছেন, আমরা একে বশ করতে পারতাম না। আমরা অবশ্যই আমাদের রবের কাছে ফিরে যাব।', 'Glory to Him who has subjected this to us, and we could never have done so ourselves. And to our Lord we will return.', 'Q43:13-14']
  ]],
  ['day', 'সারা দিনের দুআ', 'Dua through the day', [
    ['দুশ্চিন্তা আর দুঃখের সময়', 'In worry and sadness', 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ', 'আল্লা-হুম্মা ইন্নী আ’ঊযু বিকা মিনাল হাম্মি ওয়াল হাযান, ওয়াল ‘আজযি ওয়াল কাসাল, ওয়াল বুখলি ওয়াল জুবন, ওয়া দ্বালা’য়িদ দাইনি ওয়া গালাবাতির রিজাল।', 'Allahumma inni a‘udhu bika minal-hammi wal-hazan, wal-‘ajzi wal-kasal, wal-bukhli wal-jubn, wa dala‘id-dayni wa ghalabatir-rijal.', 'হে আল্লাহ, আমি আশ্রয় চাই দুশ্চিন্তা ও দুঃখ থেকে, অক্ষমতা ও অলসতা থেকে, কৃপণতা ও ভীরুতা থেকে, ঋণের বোঝা আর মানুষের চাপ থেকে।', 'O Allah, I seek refuge in You from worry and grief, from weakness and laziness, from miserliness and cowardice, and from the burden of debt and being overpowered by men.', 'B6369'],
    ['বিপদে ও কঠিন সময়ে', 'In distress', 'لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ', 'লা ইলা-হা ইল্লাল্লা-হুল ‘আযীমুল হালীম, লা ইলা-হা ইল্লাল্লা-হু রব্বুল ‘আরশিল ‘আযীম, লা ইলা-হা ইল্লাল্লা-হু রব্বুস সামা-ওয়া-তি ওয়া রব্বুল আরদ্বি ওয়া রব্বুল ‘আরশিল কারীম।', 'La ilaha illallahul-‘Azimul-Halim, la ilaha illallahu Rabbul-‘Arshil-‘Azim, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-‘Arshil-Karim.', 'আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি মহান, সহনশীল। আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি মহান আরশের রব। আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি আসমান, জমিন ও সম্মানিত আরশের রব।', 'There is no god but Allah, the Great, the Forbearing. There is no god but Allah, Lord of the Mighty Throne. There is no god but Allah, Lord of the heavens, the earth and the Noble Throne.', 'B6346'],
    ['অস্থির লাগলে', 'When you feel overwhelmed', 'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ', 'ইয়া হাইয়্যু ইয়া ক্বাইয়্যূমু বিরাহমাতিকা আসতাগীস।', 'Ya Hayyu ya Qayyumu birahmatika astaghith.', 'হে চিরঞ্জীব, হে সবকিছুর ধারক, আপনার রহমতের উসিলায় আমি সাহায্য চাই।', 'O Ever-Living, O Sustainer, by Your mercy I seek help.', 'T'],
    ['কাজ কঠিন লাগলে', 'When a task feels hard', 'اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا', 'আল্লা-হুম্মা লা সাহলা ইল্লা মা জা’আলতাহূ সাহলা, ওয়া আনতা তাজ’আলুল হাযনা ইযা শি’তা সাহলা।', 'Allahumma la sahla illa ma ja‘altahu sahla, wa anta taj‘alul-hazna idha shi’ta sahla.', 'হে আল্লাহ, আপনি যা সহজ করেন তা ছাড়া কিছুই সহজ নয়। আপনি চাইলে কঠিনকেও সহজ করে দেন।', 'O Allah, nothing is easy except what You make easy, and You make the difficult easy if You wish.', 'IH'],
    ['রাগ উঠলে', 'When angry', 'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ', 'আ’ঊযু বিল্লা-হি মিনাশ শাইত্বা-নির রজীম।', 'A‘udhu billahi minash-shaytanir-rajim.', 'বিতাড়িত শয়তান থেকে আমি আল্লাহর কাছে আশ্রয় চাই।', 'I seek refuge in Allah from the accursed Satan.', 'B6115'],
    ['ঋণ থেকে মুক্তির দুআ', 'For relief from debt', 'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ', 'আল্লা-হুম্মাকফিনী বিহালালিকা ‘আন হারামিক, ওয়া আগনিনী বিফাদ্বলিকা ‘আম্মান সিওয়াক।', 'Allahummakfini bihalalika ‘an haramik, wa aghnini bifadlika ‘amman siwak.', 'হে আল্লাহ, আপনার হালাল দিয়ে আমাকে হারাম থেকে বাঁচান, আর আপনার অনুগ্রহে আপনি ছাড়া সবার থেকে আমাকে অমুখাপেক্ষী করুন।', 'O Allah, suffice me with what You made lawful over what You made unlawful, and make me independent of all besides You by Your bounty.', 'T'],
    ['শরীরে ব্যথা হলে (৭ বার)', 'When in physical pain (7 times)', 'أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ', 'আ’ঊযু বিল্লা-হি ওয়া কুদরাতিহী মিন শাররি মা আজিদু ওয়া উহা-যির।', 'A‘udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir.', 'যে ব্যথা আমি অনুভব করছি আর যার ভয় করছি, তার অনিষ্ট থেকে আল্লাহর ও তাঁর শক্তির কাছে আশ্রয় চাই। (ব্যথার জায়গায় হাত রেখে প্রথমে ৩ বার বিসমিল্লাহ বলো)', 'I seek refuge in Allah and His power from the evil of what I feel and fear. (Place your hand on the spot and first say Bismillah 3 times)', 'M2202'],
    ['অসুস্থকে দেখতে গেলে', 'When visiting the sick', 'لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ', 'লা বা’সা ত্বাহূরুন ইনশা-আল্লা-হ।', 'La ba’sa tahurun in sha’ Allah.', 'ভয় নেই, ইনশাআল্লাহ এটা (গুনাহ থেকে) পবিত্রকারী।', 'No harm, it is a purification, if Allah wills.', 'B3616'],
    ['হাঁচি দিলে', 'When you sneeze', 'الْحَمْدُ لِلَّهِ', 'আলহামদু লিল্লা-হ। (শ্রোতা বলবে: ইয়ারহামুকাল্লা-হ। উত্তরে: ইয়াহদীকুমুল্লা-হু ওয়া ইউসলিহু বা-লাকুম)', 'Alhamdu lillah. (Listener: Yarhamukallah. Reply: Yahdikumullahu wa yuslihu balakum)', 'সব প্রশংসা আল্লাহর। (শ্রোতা: আল্লাহ তোমার ওপর রহম করুন। উত্তরে: আল্লাহ তোমাদের হেদায়েত দিন আর অবস্থা ভালো করুন)', 'All praise is for Allah. (Listener: May Allah have mercy on you. Reply: May Allah guide you and set your affairs right)', 'B6224'],
    ['বৃষ্টি হলে', 'When it rains', 'اللَّهُمَّ صَيِّبًا نَافِعًا', 'আল্লা-হুম্মা সাইয়্যিবান নাফি’আ।', 'Allahumma sayyiban nafi‘a.', 'হে আল্লাহ, একে উপকারী বৃষ্টি বানিয়ে দিন।', 'O Allah, make it a beneficial rain.', 'B1032'],
    ['বাবা-মায়ের জন্য', 'For your parents', 'رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا', 'রব্বির হামহুমা কামা রব্বায়ানী সাগীরা।', 'Rabbir-hamhuma kama rabbayani saghira.', 'হে আমার রব, তাঁদের ওপর রহম করুন, যেভাবে তাঁরা ছোটবেলায় আমাকে লালনপালন করেছেন।', 'My Lord, have mercy on them as they raised me when I was small.', 'Q17:24'],
    ['দুনিয়া ও আখিরাতের কল্যাণ', 'Good in this world and the next', 'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ', 'রব্বানা আতিনা ফিদ্দুনইয়া হাসানাতাও ওয়া ফিল আখিরাতি হাসানাতাও ওয়াকিনা ‘আযাবান নার।', 'Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina ‘adhaban-nar.', 'হে আমাদের রব, দুনিয়াতে কল্যাণ দিন, আখিরাতেও কল্যাণ দিন, আর আমাদের আগুনের শাস্তি থেকে বাঁচান।', 'Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.', 'Q2:201'],
    ['তওবা ও ইস্তিগফার', 'Repentance and forgiveness', 'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ', 'আসতাগফিরুল্লা-হা ওয়া আতূবু ইলাইহি।', 'Astaghfirullaha wa atubu ilayh.', 'আমি আল্লাহর কাছে ক্ষমা চাই আর তাঁর দিকেই ফিরে আসি। (রাসুল ﷺ দিনে ১০০ বারের বেশি তওবা করতেন)', 'I seek Allah’s forgiveness and turn to Him in repentance. (The Prophet ﷺ repented more than 100 times a day)', 'M2702']
  ]],
  ['eve', 'সন্ধ্যার যিকির', 'Evening adhkar', [
    ['সন্ধ্যায়', 'In the evening', 'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ', 'আমসাইনা ওয়া আমসাল মুলকু লিল্লা-হি ওয়ালহামদু লিল্লা-হ, লা ইলা-হা ইল্লাল্লা-হু ওয়াহদাহূ লা শারীকা লাহূ, লাহুল মুলকু ওয়া লাহুল হামদু ওয়া হুওয়া ‘আলা কুল্লি শাইয়িন ক্বাদীর।', 'Amsayna wa amsal-mulku lillah, walhamdu lillah, la ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir.', 'আমরা সন্ধ্যায় পৌঁছলাম, আর সব রাজত্ব আল্লাহর। সব প্রশংসা আল্লাহর। আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি একক, তাঁর কোনো শরিক নেই। রাজত্ব ও প্রশংসা তাঁরই, আর তিনি সবকিছুর ওপর ক্ষমতাবান।', 'We have reached the evening and all dominion belongs to Allah. All praise is for Allah. There is no god but Allah alone, with no partner. His is the dominion and the praise, and He has power over all things.', 'M2723'],
    ['সন্ধ্যার সুরক্ষা (৩ বার)', 'Evening protection (3 times)', 'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ', 'আ’ঊযু বিকালিমাতিল্লা-হিত তা-ম্মা-তি মিন শাররি মা খালাক্ব।', 'A‘udhu bikalimatillahit-tammati min sharri ma khalaq.', 'আল্লাহর পূর্ণাঙ্গ বাণীগুলোর আশ্রয় নিচ্ছি, তিনি যা সৃষ্টি করেছেন তার অনিষ্ট থেকে।', 'I seek refuge in the perfect words of Allah from the evil of what He created.', 'M'],
    ['সন্ধ্যায় ইস্তিগফার', 'Evening istighfar', 'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ... فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ', 'সাইয়্যিদুল ইস্তিগফার সকাল ও সন্ধ্যা দুই বেলাই পড়া যায়। (সকালের অংশে পুরোটা দেখো।)', 'Sayyidul Istighfar can be read both morning and evening (see the full text in the morning section).', 'যে দিনের বেলা একে বিশ্বাসের সাথে পড়ে সন্ধ্যার আগে মারা যায়, সে জান্নাতি। রাতে পড়ে সকালের আগে মারা গেলেও তাই।', 'Whoever says it with conviction during the day and dies before evening is among the people of Paradise; the same for the night.', 'B6306']
  ]],
  ['sleep', 'ঘুমের আগে', 'Before sleep', [
    ['বিছানায় গিয়ে', 'When going to bed', 'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا', 'বিসমিকা আল্লা-হুম্মা আমূতু ওয়া আহইয়া।', 'Bismika Allahumma amutu wa ahya.', 'হে আল্লাহ, আপনার নামেই মরি (ঘুমাই), আপনার নামেই জাগি।', 'O Allah, in Your name I die (sleep) and I live.', 'B6324'],

    ['তিন কুল পড়ে হাতে ফুঁ', 'Three Quls, blow into the hands', 'قُلْ هُوَ اللَّهُ أَحَدٌ، قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، قُلْ أَعُوذُ بِرَبِّ النَّاسِ', 'সূরা ইখলাস, ফালাক ও নাস পড়ে দুই হাতে ফুঁ দিয়ে মাথা, মুখ ও শরীরের যতটা সম্ভব মুছে নাও। এভাবে ৩ বার।', 'Recite Ikhlas, Falaq and Nas, blow into your palms and wipe over your head, face and as much of the body as you can. Repeat 3 times.', 'রাসুল ﷺ প্রতি রাতে ঘুমের আগে এটা করতেন।', 'The Prophet ﷺ did this every night before sleeping.', 'B5017'],

    ['বৈঠকে তাশাহহুদ (আত্তাহিয়্যাতু)', 'Tashahhud (sitting)', 'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَىٰ عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ', 'আত্তাহিয়্যা-তু লিল্লা-হি ওয়াস সালাওয়া-তু ওয়াত ত্বাইয়্যিবা-ত। আস্সালা-মু ‘আলাইকা আইয়্যুহান নাবিইয়্যু ওয়া রাহমাতুল্লা-হি ওয়া বারাকা-তুহ। আস্সালা-মু ‘আলাইনা ওয়া ‘আলা ‘ইবা-দিল্লা-হিস সা-লিহীন। আশহাদু আল্লা ইলা-হা ইল্লাল্লা-হ, ওয়া আশহাদু আন্না মুহাম্মাদান ‘আবদুহূ ওয়া রাসূলুহ।', 'At-tahiyyatu lillahi was-salawatu wat-tayyibat. As-salamu ‘alayka ayyuhan-nabiyyu wa rahmatullahi wa barakatuh. As-salamu ‘alayna wa ‘ala ‘ibadillahis-salihin. Ash-hadu alla ilaha illallah, wa ash-hadu anna Muhammadan ‘abduhu wa rasuluh.', 'সব সম্মান, ইবাদত ও পবিত্র কথা আল্লাহর জন্য। হে নবী, আপনার ওপর শান্তি, আল্লাহর রহমত ও বরকত। আমাদের ওপর এবং আল্লাহর নেক বান্দাদের ওপর শান্তি। আমি সাক্ষ্য দিচ্ছি আল্লাহ ছাড়া কোনো ইলাহ নেই, আর মুহাম্মাদ ﷺ তাঁর বান্দা ও রাসুল।', 'All greetings, prayers and good words are for Allah. Peace be upon you, O Prophet, and the mercy and blessings of Allah. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and that Muhammad ﷺ is His servant and messenger.', 'B831'],
    ['দরূদে ইবরাহিম (শেষ বৈঠকে)', 'Durud Ibrahim (final sitting)', 'اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ', 'আল্লা-হুম্মা সাল্লি ‘আলা মুহাম্মাদিউ ওয়া ‘আলা আ-লি মুহাম্মাদিন কামা সাল্লাইতা ‘আলা ইবরা-হীমা ওয়া ‘আলা আ-লি ইবরা-হীম, ইন্নাকা হামীদুম মাজীদ। আল্লা-হুম্মা বা-রিক ‘আলা মুহাম্মাদিউ ওয়া ‘আলা আ-লি মুহাম্মাদিন কামা বা-রাকতা ‘আলা ইবরা-হীমা ওয়া ‘আলা আ-লি ইবরা-হীম, ইন্নাকা হামীদুম মাজীদ।', 'Allahumma salli ‘ala Muhammadin wa ‘ala ali Muhammad, kama sallayta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik ‘ala Muhammadin wa ‘ala ali Muhammad, kama barakta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid.', 'হে আল্লাহ, মুহাম্মাদ ﷺ ও তাঁর পরিবারের ওপর রহমত বর্ষণ করুন, যেমন ইবরাহিম আ. ও তাঁর পরিবারের ওপর করেছেন। নিশ্চয়ই আপনি প্রশংসিত, মহিমান্বিত। হে আল্লাহ, মুহাম্মাদ ﷺ ও তাঁর পরিবারের ওপর বরকত দিন, যেমন ইবরাহিম আ. ও তাঁর পরিবারের ওপর দিয়েছেন। নিশ্চয়ই আপনি প্রশংসিত, মহিমান্বিত।', 'O Allah, send prayers upon Muhammad and the family of Muhammad as You sent prayers upon Ibrahim and the family of Ibrahim; You are Praiseworthy and Glorious. O Allah, bless Muhammad and the family of Muhammad as You blessed Ibrahim and the family of Ibrahim; You are Praiseworthy and Glorious.', 'B3370'],
    ['দুআ মাসূরা (সালামের আগে)', 'Dua Masura (before salam)', 'اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ', 'আল্লা-হুম্মা ইন্নী যালামতু নাফসী যুলমান কাসীরাও ওয়া লা ইয়াগফিরুয যুনূবা ইল্লা আনতা ফাগফির লী মাগফিরাতাম মিন ‘ইনদিকা ওয়ারহামনী ইন্নাকা আনতাল গাফূরুর রাহীম।', 'Allahumma inni zalamtu nafsi zulman kathiran wa la yaghfirudh-dhunuba illa anta faghfir li maghfiratan min ‘indika warhamni innaka antal-Ghafurur-Rahim.', 'হে আল্লাহ, আমি নিজের ওপর অনেক যুলুম করেছি। আপনি ছাড়া কেউ গুনাহ ক্ষমা করতে পারে না। আপনার পক্ষ থেকে আমাকে ক্ষমা করুন, আমার ওপর রহম করুন। নিশ্চয়ই আপনি ক্ষমাশীল, দয়ালু।', 'O Allah, I have wronged myself greatly and none forgives sins but You. So grant me forgiveness from You and have mercy on me. You are the Forgiving, the Merciful.', 'B834'],
    ['সালাম ফেরানো', 'The salam (ending the prayer)', 'السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ', 'আস্সালা-মু ‘আলাইকুম ওয়া রাহমাতুল্লা-হ। (প্রথমে ডানে, তারপর বামে)', 'As-salamu ‘alaykum wa rahmatullah. (First to the right, then to the left)', 'তোমাদের ওপর শান্তি ও আল্লাহর রহমত বর্ষিত হোক।', 'Peace and the mercy of Allah be upon you.', 'AD'],
    ['দুআ কুনূত (বিতর নামাজের তৃতীয় রাকাতে, হানাফি)', 'Dua Qunut (3rd rak‘ah of witr, Hanafi)', 'اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ وَنَشْكُرُكَ وَلَا نَكْفُرُكَ وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ. اللَّهُمَّ إِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ وَإِلَيْكَ نَسْعَىٰ وَنَحْفِدُ وَنَرْجُو رَحْمَتَكَ وَنَخْشَىٰ عَذَابَكَ إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ', 'আল্লা-হুম্মা ইন্না নাস্তা’ঈনুকা ওয়া নাস্তাগফিরুকা ওয়া নু’মিনু বিকা ওয়া নাতাওয়াক্কালু ‘আলাইকা ওয়া নুসনী ‘আলাইকাল খাইর, ওয়া নাশকুরুকা ওয়া লা নাকফুরুকা, ওয়া নাখলা’উ ওয়া নাতরুকু মাইঁ ইয়াফজুরুক। আল্লা-হুম্মা ইয়্যা-কা না’বুদু ওয়া লাকা নুসাল্লী ওয়া নাসজুদু ওয়া ইলাইকা নাস’আ ওয়া নাহফিদু ওয়া নারজু রাহমাতাকা ওয়া নাখশা ‘আযা-বাকা ইন্না ‘আযা-বাকা বিলকুফফা-রি মুলহিক্ব।', 'Allahumma inna nasta‘inuka wa nastaghfiruka wa nu’minu bika wa natawakkalu ‘alayka wa nuthni ‘alaykal-khayr, wa nashkuruka wa la nakfuruka, wa nakhla‘u wa natruku man yafjuruk. Allahumma iyyaka na‘budu wa laka nusalli wa nasjudu wa ilayka nas‘a wa nahfidu wa narju rahmataka wa nakhsha ‘adhabaka inna ‘adhabaka bil-kuffari mulhiq.', 'হে আল্লাহ, আমরা আপনার কাছে সাহায্য চাই, ক্ষমা চাই, আপনার ওপর ঈমান আনি, ভরসা করি এবং উত্তম প্রশংসা করি। আমরা আপনার শুকরিয়া করি, অকৃতজ্ঞ হই না, আর যে আপনার অবাধ্য হয় তাকে ত্যাগ করি। হে আল্লাহ, আমরা আপনারই ইবাদত করি, আপনার জন্যই নামাজ পড়ি ও সিজদা করি, আপনার দিকেই ছুটি ও এগিয়ে যাই, আপনার রহমতের আশা করি আর শাস্তিকে ভয় করি। নিশ্চয়ই আপনার শাস্তি কাফিরদের ওপর পড়বে।', 'O Allah, we seek Your help and Your forgiveness, we believe in You, rely on You and praise You with good. We thank You and are not ungrateful, and we abandon and leave whoever disobeys You. O Allah, You alone we worship, to You we pray and prostrate, to You we hasten and strive, we hope for Your mercy and fear Your punishment. Indeed Your punishment will reach the disbelievers.', 'Hanafi']
  ]],

    ['আয়াতুল কুরসি', 'Ayatul Kursi', 'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...', 'পুরো আয়াত “সূরার ফযিলত” অংশে আছে।', 'The full verse is in the “Surah virtues” section.', 'প্রতি ফরজ নামাজের পর পড়লে জান্নাতে যেতে শুধু মৃত্যুই বাধা থাকে।', 'Whoever reads it after each obligatory prayer, only death stands between him and Paradise.', 'N'],
