const SU = [
  ['fat', 'সূরা ফাতিহা', 'Surah Al-Fatiha', '৭ আয়াত', '7 verses',
    { ar: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', tb: 'বিসমিল্লা-হির রাহমা-নির রাহীম। আলহামদু লিল্লা-হি রব্বিল ‘আ-লামীন। আর রাহমা-নির রাহীম। মা-লিকি ইয়াওমিদ্দীন। ইয়্যা-কা না’বুদু ওয়া ইয়্যা-কা নাস্তা’ঈন। ইহদিনাস সিরা-ত্বাল মুস্তাক্বীম। সিরা-ত্বাল্লাযীনা আন’আমতা ‘আলাইহিম, গাইরিল মাগদূবি ‘আলাইহিম ওয়ালাদ্দ্বা-ল্লীন।', te: 'Bismillahir-Rahmanir-Rahim. Alhamdu lillahi Rabbil-‘alamin. Ar-Rahmanir-Rahim. Maliki yawmid-din. Iyyaka na‘budu wa iyyaka nasta‘in. Ihdinas-siratal-mustaqim. Siratal-ladhina an‘amta ‘alayhim, ghayril-maghdubi ‘alayhim wa lad-dallin.', mb: 'আল্লাহর নামে শুরু, যিনি পরম করুণাময় অসীম দয়ালু। সব প্রশংসা আল্লাহর, যিনি সারা জাহানের রব। যিনি করুণাময়, দয়ালু, বিচার দিনের মালিক। আমরা শুধু আপনারই ইবাদত করি আর আপনারই কাছে সাহায্য চাই। আমাদের সরল পথ দেখান, তাদের পথ যাদের আপনি নিয়ামত দিয়েছেন, তাদের নয় যারা গজবপ্রাপ্ত বা পথভ্রষ্ট।', me: 'In the name of Allah, the Most Gracious, the Most Merciful. All praise is for Allah, Lord of all worlds. The Most Gracious, the Most Merciful, Master of the Day of Judgement. You alone we worship and You alone we ask for help. Guide us to the straight path, the path of those You have blessed, not of those who earned anger nor of those who went astray.' },
    [['এটা কুরআনের সবচেয়ে মহান সূরা। একে “উম্মুল কুরআন” আর “সাবউল মাসানী” বলা হয়।', 'It is the greatest surah of the Quran, called “Umm al-Quran” and “as-Sab‘ al-Mathani”.', 'B4474'],
     ['এটা দিয়ে ঝাড়ফুঁক (রুকইয়াহ) করার প্রমাণ আছে, সাহাবি এ সূরা পড়ে সাপে কাটা ব্যক্তিকে সুস্থ করেছিলেন।', 'It is used as ruqyah: a Companion recited it over a man bitten by a scorpion/snake and he recovered.', 'B5736'],
     ['নামাজের প্রতি রাকাতে পড়া হয়। হাদিসে কুদসিতে আছে, বান্দা প্রতিটি আয়াত পড়লে আল্লাহ তার জবাব দেন।', 'It is recited in every rak‘ah of prayer. In a hadith qudsi, Allah responds as the servant recites each verse.', 'M395']]],
  ['kur', 'আয়াতুল কুরসি (সূরা বাকারা ২:২৫৫)', 'Ayatul Kursi (2:255)', '১ আয়াত', '1 verse',
    { ar: 'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ', tb: 'আল্লা-হু লা ইলা-হা ইল্লা হুওয়াল হাইয়্যুল ক্বাইয়্যূম। লা তা’খুযুহূ সিনাতুঁ ওয়ালা নাওম। লাহূ মা ফিস সামা-ওয়া-তি ওয়া মা ফিল আরদ্ব। মান যাল্লাযী ইয়াশফা’উ ‘ইনদাহূ ইল্লা বিইযনিহ। ইয়া’লামু মা বাইনা আইদীহিম ওয়া মা খালফাহুম। ওয়ালা ইউহীতূনা বিশাইয়িম মিন ‘ইলমিহী ইল্লা বিমা শা-আ। ওয়াসি’আ কুরসিইয়্যুহুস সামা-ওয়া-তি ওয়াল আরদ্ব। ওয়ালা ইয়াঊদুহূ হিফযুহুমা। ওয়া হুওয়াল ‘আলিইয়্যুল ‘আযীম।', te: 'Allahu la ilaha illa huwal-Hayyul-Qayyum. La ta’khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa‘u ‘indahu illa bi’idhnih. Ya‘lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bishay’in min ‘ilmihi illa bima sha’. Wasi‘a kursiyyuhus-samawati wal-ard. Wa la ya’uduhu hifzuhuma. Wa huwal-‘Aliyyul-‘Azim.', mb: 'আল্লাহ, তিনি ছাড়া কোনো ইলাহ নেই। তিনি চিরঞ্জীব, সবকিছুর ধারক। তন্দ্রা বা নিদ্রা তাঁকে স্পর্শ করে না। আসমান ও জমিনে যা আছে সব তাঁর। তাঁর অনুমতি ছাড়া কে তাঁর কাছে সুপারিশ করতে পারে? তাদের সামনে ও পেছনে যা আছে তিনি জানেন। তিনি যা চান তা ছাড়া তাঁর জ্ঞানের কিছুই তারা আয়ত্ত করতে পারে না। তাঁর কুরসি আসমান ও জমিন জুড়ে বিস্তৃত। এ দুটোর হেফাজত তাঁকে ক্লান্ত করে না। তিনি সর্বোচ্চ, মহান।', me: 'Allah, there is no god but Him, the Ever-Living, the Sustainer. Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and the earth. Who can intercede with Him except by His permission? He knows what is before them and behind them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and their preservation does not tire Him. He is the Most High, the Most Great.' },
    [['কুরআনের সবচেয়ে মর্যাদাবান আয়াত।', 'The greatest verse in the Quran.', 'M810'],
     ['ঘুমের আগে পড়লে সকাল পর্যন্ত আল্লাহর পক্ষ থেকে একজন হেফাজতকারী থাকে, শয়তান কাছে আসতে পারে না।', 'Read before sleep, a guardian from Allah stays with you till morning and Satan cannot approach.', 'B2311'],
     ['প্রতি ফরজ নামাজের পর পড়লে জান্নাতে যেতে শুধু মৃত্যুই বাধা থাকে।', 'Read after each obligatory prayer, only death stands between you and Paradise.', 'N']]],
  ['baq', 'সূরা বাকারা', 'Surah Al-Baqarah', '২৮৬ আয়াত', '286 verses', null,
    [['যে ঘরে সূরা বাকারা পড়া হয়, সেখান থেকে শয়তান পালিয়ে যায়। তাই ঘরকে কবরস্থান বানিয়ো না।', 'Satan flees from the house in which Surah Al-Baqarah is recited. Do not turn your houses into graves.', 'M780'],
     ['কিয়ামতের দিন সূরা বাকারা ও আলে ইমরান মেঘের মতো ছায়া হয়ে এসে পাঠকের পক্ষে কথা বলবে।', 'On the Day of Judgement, Al-Baqarah and Ali ‘Imran will come like shading clouds and plead for their reciter.', 'M804'],
     ['এটা শেখা বরকত, ছেড়ে দেওয়া আফসোসের। ধীরে ধীরে রোজ কিছু অংশ পড়ার অভ্যাস করো।', 'Learning it is a blessing and leaving it is a loss. Build a habit of reading a little each day.', 'M804']]],
  ['bq2', 'সূরা বাকারার শেষ দুই আয়াত (২:২৮৫-২৮৬)', 'Last two verses of Al-Baqarah (2:285-286)', '২ আয়াত', '2 verses',
    { ar: 'آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ', mb: 'রাসুল তাঁর রবের পক্ষ থেকে যা নাযিল হয়েছে তাতে বিশ্বাস করেছেন, মুমিনরাও। সবাই আল্লাহ, তাঁর ফেরেশতা, কিতাব ও রাসুলদের ওপর বিশ্বাস করে। তারা বলে, “আমরা রাসুলদের কারো মধ্যে ভেদাভেদ করি না।” আর বলে, “আমরা শুনলাম ও মেনে নিলাম। হে আমাদের রব, আপনার ক্ষমা চাই, আপনার কাছেই ফিরে যেতে হবে।” আল্লাহ কারো ওপর সাধ্যের বাইরে বোঝা চাপান না। সে যা অর্জন করে তার ফল সে-ই পায়। “হে আমাদের রব, ভুলে গেলে বা ভুল করলে আমাদের পাকড়াও করবেন না। আগের লোকদের ওপর যেমন বোঝা চাপিয়েছিলেন, আমাদের ওপর তেমন চাপাবেন না। যে বোঝা বইবার শক্তি আমাদের নেই তা দেবেন না। আমাদের মাফ করুন, ক্ষমা করুন, দয়া করুন। আপনিই আমাদের অভিভাবক, কাফির সম্প্রদায়ের বিরুদ্ধে আমাদের সাহায্য করুন।”', me: 'The Messenger believes in what was revealed to him from his Lord, and so do the believers. All believe in Allah, His angels, His books and His messengers: “We make no distinction between any of His messengers.” And they say: “We hear and obey. Your forgiveness, our Lord, and to You is the final return.” Allah does not burden a soul beyond its capacity. It gets what it earns and bears what it earns. “Our Lord, do not hold us accountable if we forget or make mistakes. Our Lord, do not place on us a burden like that You placed on those before us. Our Lord, do not burden us with what we cannot bear. Pardon us, forgive us and have mercy on us. You are our Protector, so help us against the disbelieving people.”' },
    [['যে রাতে এ দুই আয়াত পড়ে, এ দুটোই তার জন্য যথেষ্ট (অনিষ্ট থেকে রক্ষায়)।', 'Whoever recites these two verses at night, they will suffice him.', 'B5009'],
     ['জিবরিল আ. এই আয়াতগুলোকে “দুই নূরের” একটি বলেছেন, যা আগে কোনো নবীকে দেওয়া হয়নি।', 'Jibril called them one of “two lights”, given to the Prophet ﷺ and to no prophet before him.', 'M806']]],
  ['kah', 'সূরা কাহফ', 'Surah Al-Kahf', '১১০ আয়াত', '110 verses', null,
    [['জুমার দিন পড়লে দুই জুমার মাঝের সময় নূরে আলোকিত হয়।', 'Whoever reads it on Friday will have a light shine for him between the two Fridays.', 'Hakim'],
     ['প্রথম ১০ আয়াত মুখস্থ করলে দাজ্জালের ফিতনা থেকে রক্ষা পাওয়া যায়।', 'Whoever memorises the first ten verses is protected from the trial of the Dajjal.', 'M809']]],
  ['mul', 'সূরা মুলক', 'Surah Al-Mulk', '৩০ আয়াত', '30 verses',
    { ar: 'تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ۝ الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ', tb: 'তাবা-রাকাল্লাযী বিয়াদিহিল মুলকু ওয়া হুওয়া ‘আলা কুল্লি শাইয়িন ক্বাদীর। আল্লাযী খালাকাল মাওতা ওয়াল হায়া-তা লিয়াবলুওয়াকুম আইয়ুকুম আহসানু ‘আমালা, ওয়া হুওয়াল ‘আযীযুল গাফূর।', te: 'Tabarakal-ladhi biyadihil-mulku wa huwa ‘ala kulli shay’in qadir. Alladhi khalaqal-mawta wal-hayata liyabluwakum ayyukum ahsanu ‘amala, wa huwal-‘Azizul-Ghafur.', mb: 'বরকতময় তিনি, যাঁর হাতে সমস্ত কর্তৃত্ব, আর তিনি সবকিছুর ওপর ক্ষমতাবান। যিনি মৃত্যু ও জীবন সৃষ্টি করেছেন, যাতে পরীক্ষা করেন তোমাদের মধ্যে কে কাজে উত্তম। তিনি পরাক্রমশালী, ক্ষমাশীল। (এটা শুধু প্রথম ২ আয়াত। পুরো সূরা কুরআন থেকে পড়ো।)', me: 'Blessed is He in whose hand is dominion, and He has power over all things. He who created death and life to test which of you is best in deeds. He is the Almighty, the Forgiving. (These are only the first 2 verses. Read the full surah from the Quran.)' },
    [['৩০ আয়াতের এই সূরা পাঠকারীর জন্য সুপারিশ করতে থাকে, যতক্ষণ না তাকে ক্ষমা করা হয়।', 'This surah of 30 verses keeps interceding for its reciter until he is forgiven.', 'T2891'],
     ['এটা কবরের আযাব থেকে রক্ষাকারী ও মুক্তিদানকারী, হাদিসটির সনদকে হাসান বলা হয়েছে (হাকিম, তাবারানি)।', 'It is a protector and a saver from the punishment of the grave. Scholars graded the chain hasan (Hakim, Tabarani).', 'Hakim'],
     ['রাসুল ﷺ সূরা সাজদাহ ও সূরা মুলক না পড়ে ঘুমাতেন না।', 'The Prophet ﷺ would not sleep until he had recited Surah As-Sajdah and Surah Al-Mulk.', 'T3404']]],
  ['ikh', 'সূরা ইখলাস', 'Surah Al-Ikhlas', '৪ আয়াত', '4 verses',
    { ar: 'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ', tb: 'কুল হুওয়াল্লা-হু আহাদ। আল্লা-হুস সামাদ। লাম ইয়ালিদ ওয়া লাম ইউলাদ। ওয়া লাম ইয়াকুল্লাহূ কুফুওয়ান আহাদ।', te: 'Qul huwallahu ahad. Allahus-samad. Lam yalid wa lam yulad. Wa lam yakun lahu kufuwan ahad.', mb: 'বলো, তিনি আল্লাহ, একক। আল্লাহ অমুখাপেক্ষী। তিনি কাউকে জন্ম দেননি, কেউ তাঁকে জন্ম দেয়নি। তাঁর সমকক্ষ কেউ নেই।', me: 'Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born. And there is none comparable to Him.' },
    [['এই সূরা কুরআনের এক-তৃতীয়াংশের সমান।', 'This surah equals one third of the Quran.', 'B5013'],
     ['এক সাহাবি প্রতি রাকাতে এই সূরা পড়তেন। রাসুল ﷺ বললেন, তাকে জানিয়ে দাও, আল্লাহ তাকে ভালোবাসেন।', 'A Companion used to recite this surah in every rak‘ah. The Prophet ﷺ said: tell him that Allah loves him.', 'B7375']]],
  ['fal', 'সূরা ফালাক ও নাস', 'Surah Al-Falaq and An-Nas', '৫ + ৬ আয়াত', '5 + 6 verses',
    { ar: 'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ\n\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ', tb: 'ফালাক: কুল আ’ঊযু বিরব্বিল ফালাক। মিন শাররি মা খালাক। ওয়া মিন শাররি গাসিক্বিন ইযা ওয়াক্বাব। ওয়া মিন শাররিন নাফফা-সা-তি ফিল ‘উক্বাদ। ওয়া মিন শাররি হাসিদিন ইযা হাসাদ।\nনাস: কুল আ’ঊযু বিরব্বিন নাস। মালিকিন নাস। ইলা-হিন নাস। মিন শাররিল ওয়াসওয়া-সিল খান্নাস। আল্লাযী ইউওয়াসউইসু ফী সুদূরিন নাস। মিনাল জিন্নাতি ওয়ান নাস।', te: 'Falaq: Qul a‘udhu bi Rabbil-falaq. Min sharri ma khalaq. Wa min sharri ghasiqin idha waqab. Wa min sharrin-naffathati fil-‘uqad. Wa min sharri hasidin idha hasad.\nNas: Qul a‘udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.', mb: 'ফালাক: বলো, আমি ভোরের রবের আশ্রয় চাই, তিনি যা সৃষ্টি করেছেন তার অনিষ্ট থেকে, অন্ধকার রাতের অনিষ্ট থেকে যখন তা ছেয়ে যায়, গিঁটে ফুঁ দেওয়া জাদুকরদের অনিষ্ট থেকে, আর হিংসুকের অনিষ্ট থেকে যখন সে হিংসা করে।\nনাস: বলো, আমি মানুষের রবের আশ্রয় চাই, মানুষের বাদশাহ, মানুষের ইলাহের, কুমন্ত্রণাদাতা আত্মগোপনকারীর অনিষ্ট থেকে, যে মানুষের অন্তরে কুমন্ত্রণা দেয়, জিনের মধ্য থেকে এবং মানুষের মধ্য থেকে।', me: 'Falaq: Say, I seek refuge in the Lord of daybreak, from the evil of what He created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of an envier when he envies.\nNas: Say, I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the whispering retreating one, who whispers in the hearts of mankind, from among jinn and mankind.' },
    [['রাসুল ﷺ বলেছেন, এগুলোর মতো আর কিছু নাযিল হয়নি, এই দুই সূরার মতো আশ্রয়ের কিছু নেই।', 'The Prophet ﷺ said nothing like them has been revealed; no refuge is like these two surahs.', 'M814'],
     ['প্রতি রাতে ঘুমের আগে তিন কুল পড়ে হাতে ফুঁ দিয়ে শরীরে মুছতেন।', 'Every night before sleep he would recite the three Quls, blow into his hands and wipe over his body.', 'B5017'],
     ['সকাল-সন্ধ্যায় ৩ বার করে পড়লে সব অনিষ্টের জন্য যথেষ্ট (আবু দাউদ, তিরমিযি)।', 'Read 3 times in the morning and evening, they suffice against every harm (Abu Dawud, Tirmidhi).', 'AD']]],
  ['has', 'সূরা হাশরের শেষ ৩ আয়াত (৫৯:২২-২৪)', 'Last 3 verses of Al-Hashr (59:22-24)', '৩ আয়াত', '3 verses',
    { ar: 'هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۖ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۖ هُوَ الرَّحْمَٰنُ الرَّحِيمُ ۝ هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ ۚ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ ۝ هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ ۚ يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ', mb: 'তিনিই আল্লাহ, তিনি ছাড়া কোনো ইলাহ নেই, অদৃশ্য ও দৃশ্যের জ্ঞানী, তিনি পরম করুণাময়, অসীম দয়ালু। তিনিই আল্লাহ, তিনি ছাড়া কোনো ইলাহ নেই, তিনিই বাদশাহ, পবিত্র, শান্তিদাতা, নিরাপত্তাদাতা, রক্ষক, পরাক্রমশালী, প্রতাপশালী, মহিমান্বিত। তারা যাকে শরিক করে, আল্লাহ তা থেকে পবিত্র। তিনিই আল্লাহ, স্রষ্টা, উদ্ভাবক, রূপদাতা। সুন্দর সুন্দর নাম তাঁরই। আসমান ও জমিনের সবকিছু তাঁর তাসবিহ পড়ে। তিনি পরাক্রমশালী, প্রজ্ঞাময়।', me: 'He is Allah, there is no god but Him, Knower of the unseen and the seen, the Most Gracious, the Most Merciful. He is Allah, there is no god but Him, the Sovereign, the Pure, the Source of Peace, the Granter of Security, the Guardian, the Almighty, the Compeller, the Supreme. Glory to Allah above what they associate. He is Allah, the Creator, the Inventor, the Fashioner. To Him belong the most beautiful names. Whatever is in the heavens and earth glorifies Him. He is the Almighty, the Wise.' },
    [['তিরমিযিতে একটি বর্ণনা আছে: সকালে ৩ বার আউযুবিল্লাহিস সামিইল আলীম… পড়ে এই আয়াতগুলো পড়লে ৭০ হাজার ফেরেশতা সন্ধ্যা পর্যন্ত দুআ করেন।', 'A narration in Tirmidhi says: whoever says A‘udhu billahis-sami‘il-‘alim three times in the morning and recites these verses, 70,000 angels pray for him until evening.', 'T2922'],
     ['সতর্কতা: এই বর্ণনার সনদ নিয়ে আলেমদের মতভেদ আছে, অনেকে দুর্বল বলেছেন। তবে আয়াতগুলোতে আল্লাহর সুন্দর নামের পরিচয় আছে, তাই এমনিতেই পড়া ও বোঝা মূল্যবান।', 'Caution: scholars differ on its chain and many graded it weak. Still, the verses introduce Allah’s beautiful names, so reading and reflecting on them is valuable in itself.', '']]],
  ['weak', 'প্রচলিত কিন্তু সহিহ নয় এমন কিছু ফযিলত', 'Popular virtues that are not authentic', 'সতর্কতা', 'Caution', null,
    [['সূরা ইয়াসিনকে “কুরআনের হৃদয়” বলার হাদিসটি তিরমিযিতে আছে, কিন্তু সনদ দুর্বল। সূরা ইয়াসিন কুরআনের অংশ হিসেবে অবশ্যই পড়ার মতো, তবে এর বিশেষ ফযিলত নিয়ে দুর্বল বর্ণনা থেকে সাবধান থাকা ভালো।', 'The hadith calling Surah Yasin “the heart of the Quran” is in Tirmidhi but has a weak chain. Yasin is certainly worth reading as part of the Quran, but be careful with special virtues based on weak narrations.', 'T2887'],
     ['“প্রতি রাতে সূরা ওয়াকিয়া পড়লে অভাবে পড়বে না” এই বর্ণনাও দুর্বল বলা হয়েছে।', 'The narration “whoever reads Surah Al-Waqi‘ah every night will never be poor” is also graded weak.', 'Bayhaqi'],
     ['কোনো ফযিলত নিয়ে সন্দেহ হলে স্থানীয় নির্ভরযোগ্য আলেমের কাছ থেকে জেনে নিও।', 'If you doubt any virtue, ask a trusted local scholar.', '']]]

const mkTx = (rows, num) => { const nb = (i) => num === false ? '' : '(' + bn(i + 1) + ') ', ne = (i) => num === false ? '' : '(' + (i + 1) + ') '; return { ar: rows.map(r => r[0]).join(' ۝ '), tb: rows.map(r => r[1]).join(' '), te: rows.map(r => r[2]).join(' '), mb: rows.map((r, i) => nb(i) + r[3]).join(' '), me: rows.map((r, i) => ne(i) + r[4]).join(' ') }; };
const SS = {
  97: ['কদর', 'Al-Qadr', [
    ['إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ', 'ইন্না আনযালনা-হু ফী লাইলাতিল কদর।', 'Inna anzalnahu fi laylatil-qadr.', 'নিশ্চয়ই আমি এটা (কুরআন) নাযিল করেছি কদরের রাতে।', 'Indeed, We sent it (the Quran) down on the Night of Decree.'],
    ['وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ', 'ওয়া মা আদরা-কা মা লাইলাতুল কদর।', 'Wa ma adraka ma laylatul-qadr.', 'তুমি কি জানো কদরের রাত কী?', 'And what will make you know what the Night of Decree is?'],
    ['لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ', 'লাইলাতুল কদরি খাইরুম মিন আলফি শাহর।', 'Laylatul-qadri khayrum min alfi shahr.', 'কদরের রাত হাজার মাসের চেয়ে উত্তম।', 'The Night of Decree is better than a thousand months.'],
    ['تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ', 'তানাযযালুল মালা-ইকাতু ওয়ার রূহু ফীহা বিইযনি রাব্বিহিম মিন কুল্লি আমর।', 'Tanazzalul-mala’ikatu war-ruhu fiha bi-idhni rabbihim min kulli amr.', 'ফেরেশতারা ও রূহ (জিবরাইল) সেই রাতে তাদের রবের অনুমতিক্রমে সব আদেশ নিয়ে অবতরণ করে।', 'The angels and the Spirit (Jibril) descend therein by permission of their Lord with every decree.'],
    ['سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ', 'সালা-মুন হিয়া হাত্তা মাতলা‘ইল ফাজর।', 'Salamun hiya hatta matla‘il-fajr.', 'এটা শান্তিময়, ফজর উদয় হওয়া পর্যন্ত।', 'Peace it is, until the rising of dawn.']]],
  102: ['তাকাসুর', 'At-Takathur', [
    ['أَلْهَاكُمُ التَّكَاثُرُ', 'আলহা-কুমুত তাকা-সুর।', 'Alhakumut-takathur.', 'প্রাচুর্যের প্রতিযোগিতা তোমাদের গাফেল রেখেছে,', 'Competition in worldly increase diverts you,'],
    ['حَتَّىٰ زُرْتُمُ الْمَقَابِرَ', 'হাত্তা যুরতুমুল মাকা-বির।', 'Hatta zurtumul-maqabir.', 'যতক্ষণ না তোমরা কবরে পৌঁছাও।', 'Until you visit the graves.'],
    ['كَلَّا سَوْفَ تَعْلَمُونَ', 'কাল্লা সাওফা তা‘লামূন।', 'Kalla sawfa ta‘lamun.', 'কখনো নয়! শিগগিরই তোমরা জানবে।', 'No! You are going to know.'],
    ['ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ', 'সুম্মা কাল্লা সাওফা তা‘লামূন।', 'Thumma kalla sawfa ta‘lamun.', 'আবার বলি, কখনো নয়! শিগগিরই জানবে।', 'Then, no! You are going to know.'],
    ['كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ', 'কাল্লা লাও তা‘লামূনা ‘ইলমাল ইয়াকীন।', 'Kalla law ta‘lamuna ‘ilmal-yaqin.', 'কখনো নয়! যদি তোমরা নিশ্চিত জ্ঞানে জানতে (তবে এমন করতে না)।', 'No! If you only knew with certain knowledge (you would not act so).'],
    ['لَتَرَوُنَّ الْجَحِيمَ', 'লাতারাউন্নাল জাহীম।', 'Latarawunnal-jahim.', 'তোমরা অবশ্যই জাহান্নাম দেখবে।', 'You will surely see the Hellfire.'],
    ['ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ', 'সুম্মা লাতারাউন্নাহা ‘আইনাল ইয়াকীন।', 'Thumma latarawunnaha ‘aynal-yaqin.', 'তারপর অবশ্যই তা দেখবে চাক্ষুষ নিশ্চয়তার সাথে।', 'Then you will surely see it with the eye of certainty.'],
    ['ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ', 'সুম্মা লাতুসআলুন্না ইয়াওমাইযিন ‘আনিন না‘ঈম।', 'Thumma latus’alunna yawma’idhin ‘anin-na‘im.', 'তারপর সেদিন তোমাদের অবশ্যই নিয়ামত সম্পর্কে জিজ্ঞেস করা হবে।', 'Then, that Day, you will surely be asked about the blessings.']]],
  103: ['আসর', 'Al-‘Asr', [
    ['وَالْعَصْرِ', 'ওয়াল ‘আসর।', 'Wal-‘asr.', 'কসম যুগের (সময়ের),', 'By time,'],
    ['إِنَّ الْإِنسَانَ لَفِي خُسْرٍ', 'ইন্নাল ইনসা-না লাফী খুসর।', 'Innal-insana lafi khusr.', 'নিশ্চয়ই মানুষ ক্ষতির মধ্যে আছে,', 'Indeed, mankind is in loss,'],
    ['إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ', 'ইল্লাল্লাযীনা আ-মানূ ওয়া ‘আমিলুস সা-লিহা-তি ওয়া তাওয়া-সাও বিলহাক্কি ওয়া তাওয়া-সাও বিস সাবর।', 'Illal-ladhina amanu wa ‘amilus-salihati wa tawasaw bil-haqqi wa tawasaw bis-sabr.', 'তারা ছাড়া, যারা ঈমান এনেছে, সৎকাজ করেছে এবং একে অপরকে সত্যের উপদেশ ও ধৈর্যের উপদেশ দিয়েছে।', 'Except those who believe, do righteous deeds, and advise each other to truth and advise each other to patience.']]],
  104: ['হুমাযাহ', 'Al-Humazah', [
    ['وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ', 'ওয়াইলুল লিকুল্লি হুমাযাতিল লুমাযাহ।', 'Waylul likulli humazatil-lumazah.', 'দুর্ভোগ প্রত্যেক এমন ব্যক্তির, যে সামনে-পেছনে নিন্দা ও দোষ খোঁজে,', 'Woe to every scorner and backbiter,'],
    ['الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ', 'আল্লাযী জামা‘আ মা-লাঁও ওয়া ‘আদ্দাদাহ।', 'Alladhi jama‘a malan wa ‘addadah.', 'যে সম্পদ জমায় আর বারবার গোনে,', 'Who collects wealth and counts it,'],
    ['يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ', 'ইয়াহসাবু আন্না মা-লাহূ আখলাদাহ।', 'Yahsabu anna malahu akhladah.', 'সে মনে করে তার সম্পদ তাকে চিরস্থায়ী করবে।', 'Thinking that his wealth will make him immortal.'],
    ['كَلَّا ۖ لَيُنبَذَنَّ فِي الْحُطَمَةِ', 'কাল্লা, লাইয়ুনবাযান্না ফিল হুতামাহ।', 'Kalla, layunbadhanna fil-hutamah.', 'কখনো নয়! তাকে অবশ্যই হুতামায় নিক্ষেপ করা হবে।', 'No! He will surely be thrown into the Crusher.'],
    ['وَمَا أَدْرَاكَ مَا الْحُطَمَةُ', 'ওয়া মা আদরা-কা মাল হুতামাহ।', 'Wa ma adraka mal-hutamah.', 'তুমি কি জানো হুতামা কী?', 'And what will make you know what the Crusher is?'],
    ['نَارُ اللَّهِ الْمُوقَدَةُ', 'নারুল্লা-হিল মূকাদাহ।', 'Narullahil-muqadah.', 'এটা আল্লাহর প্রজ্বলিত আগুন,', 'It is the fire of Allah, kindled,'],
    ['الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ', 'আল্লাতী তাত্তালি‘উ ‘আলাল আফইদাহ।', 'Allati tattali‘u ‘alal-af’idah.', 'যা হৃদয় পর্যন্ত পৌঁছে যাবে।', 'Which reaches the hearts.'],
    ['إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ', 'ইন্নাহা ‘আলাইহিম মু’সাদাহ।', 'Innaha ‘alayhim mu’sadah.', 'তা তাদের ওপর বন্ধ করে দেওয়া হবে,', 'Indeed, it will be closed down upon them'],
    ['فِي عَمَدٍ مُّمَدَّدَةٍ', 'ফী ‘আমাদিম মুমাদ্দাদাহ।', 'Fi ‘amadim mumaddadah.', 'লম্বা লম্বা খুঁটিতে।', 'In extended columns.']]],
  105: ['ফীল', 'Al-Fil', [
    ['أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ', 'আলাম তারা কাইফা ফা‘আলা রাব্বুকা বিআসহা-বিল ফীল।', 'Alam tara kayfa fa‘ala rabbuka bi-ashabil-fil.', 'তুমি কি দেখোনি তোমার রব হাতিওয়ালাদের সাথে কী করেছিলেন?', 'Have you not seen how your Lord dealt with the companions of the elephant?'],
    ['أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ', 'আলাম ইয়াজ‘আল কাইদাহুম ফী তাদলীল।', 'Alam yaj‘al kaydahum fi tadlil.', 'তিনি কি তাদের চক্রান্ত ব্যর্থ করে দেননি?', 'Did He not make their plan go astray?'],
    ['وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ', 'ওয়া আরসালা ‘আলাইহিম তাইরান আবা-বীল।', 'Wa arsala ‘alayhim tayran ababil.', 'আর তাদের ওপর ঝাঁকে ঝাঁকে পাখি পাঠিয়েছিলেন,', 'And He sent against them birds in flocks,'],
    ['تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ', 'তারমীহিম বিহিজা-রাতিম মিন সিজ্জীল।', 'Tarmihim bihijaratim min sijjil.', 'যারা তাদের ওপর পোড়ামাটির পাথর ছুড়ছিল।', 'Striking them with stones of baked clay,'],
    ['فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ', 'ফাজা‘আলাহুম কা‘আসফিম মা’কূল।', 'Faja‘alahum ka‘asfim ma’kul.', 'ফলে তিনি তাদের করে দিলেন চিবানো ভূসির মতো।', 'And made them like eaten straw.']]],
  106: ['কুরাইশ', 'Quraysh', [
    ['لِإِيلَافِ قُرَيْشٍ', 'লি-ঈলা-ফি কুরাইশ।', 'Li-ilafi Quraysh.', 'কুরাইশদের অভ্যস্ত করার কারণে,', 'For the accustomed security of the Quraysh,'],
    ['إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ', 'ঈলা-ফিহিম রিহলাতাশ শিতা-য়ি ওয়াস সাইফ।', 'Ilafihim rihlatash-shita’i was-sayf.', 'শীত ও গ্রীষ্মের সফরে তাদের অভ্যস্ত করার কারণে,', 'Their accustomed security in the winter and summer journeys,'],
    ['فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ', 'ফালইয়া‘বুদূ রাব্বা হা-যাল বাইত।', 'Falya‘budu rabba hadhal-bayt.', 'তাদের উচিত এই ঘরের রবের ইবাদত করা,', 'Let them worship the Lord of this House,'],
    ['الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ', 'আল্লাযী আত‘আমাহুম মিন জূ‘ইঁউ ওয়া আ-মানাহুম মিন খাউফ।', 'Alladhi at‘amahum min ju‘in wa amanahum min khawf.', 'যিনি তাদের ক্ষুধায় খাবার দিয়েছেন আর ভয় থেকে নিরাপত্তা দিয়েছেন।', 'Who has fed them against hunger and made them safe from fear.']]],
  107: ['মাঊন', 'Al-Ma‘un', [
    ['أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ', 'আরাআইতাল্লাযী ইউকাযযিবু বিদ্দীন।', 'Ara’aytal-ladhi yukadhdhibu bid-din.', 'তুমি কি তাকে দেখেছ, যে প্রতিদান দিবসকে অস্বীকার করে?', 'Have you seen the one who denies the Judgement?'],
    ['فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ', 'ফাযা-লিকাল্লাযী ইয়াদু‘উল ইয়াতীম।', 'Fadhalikal-ladhi yadu‘ul-yatim.', 'সে-ই তো এতিমকে ধাক্কা দেয়,', 'That is the one who drives away the orphan,'],
    ['وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ', 'ওয়া লা ইয়াহুদ্দু ‘আলা তা‘আ-মিল মিসকীন।', 'Wa la yahuddu ‘ala ta‘amil-miskin.', 'আর মিসকিনকে খাবার দিতে উৎসাহ দেয় না।', 'And does not encourage the feeding of the poor.'],
    ['فَوَيْلٌ لِّلْمُصَلِّينَ', 'ফাওয়াইলুল লিলমুসাল্লীন।', 'Fawaylul lil-musallin.', 'অতএব দুর্ভোগ সেই নামাজিদের জন্য,', 'So woe to those who pray,'],
    ['الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ', 'আল্লাযীনা হুম ‘আন সালা-তিহিম সা-হূন।', 'Alladhina hum ‘an salatihim sahun.', 'যারা নিজেদের নামাজ সম্পর্কে উদাসীন,', 'Who are heedless of their prayer,'],
    ['الَّذِينَ هُمْ يُرَاءُونَ', 'আল্লাযীনা হুম ইউরাউন।', 'Alladhina hum yura’un.', 'যারা লোক দেখানোর জন্য করে,', 'Those who show off,'],
    ['وَيَمْنَعُونَ الْمَاعُونَ', 'ওয়া ইয়ামনা‘ঊনাল মা-‘ঊন।', 'Wa yamna‘unal-ma‘un.', 'আর নিত্যব্যবহার্য ছোটখাটো জিনিস দিতে বারণ করে।', 'And withhold small kindnesses.']]],
  108: ['কাওসার', 'Al-Kawthar', [
    ['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ', 'ইন্না আ‘তাইনা-কাল কাওসার।', 'Inna a‘taynakal-Kawthar.', 'নিশ্চয়ই আমি তোমাকে কাওসার দান করেছি।', 'Indeed, We have granted you al-Kawthar.'],
    ['فَصَلِّ لِرَبِّكَ وَانْحَرْ', 'ফাসাল্লি লিরাব্বিকা ওয়ানহার।', 'Fasalli lirabbika wanhar.', 'অতএব তোমার রবের জন্য নামাজ পড়ো ও কুরবানি করো।', 'So pray to your Lord and sacrifice.'],
    ['إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ', 'ইন্না শা-নিয়াকা হুওয়াল আবতার।', 'Inna shani’aka huwal-abtar.', 'নিশ্চয়ই তোমার শত্রুই তো নির্বংশ।', 'Indeed, your enemy is the one cut off.']]],
  109: ['কাফিরূন', 'Al-Kafirun', [
    ['قُلْ يَا أَيُّهَا الْكَافِرُونَ', 'কুল ইয়া আইয়ুহাল কা-ফিরূন।', 'Qul ya ayyuhal-kafirun.', 'বলো, হে কাফিররা!', 'Say: O disbelievers,'],
    ['لَا أَعْبُدُ مَا تَعْبُدُونَ', 'লা আ‘বুদু মা তা‘বুদূন।', 'La a‘budu ma ta‘budun.', 'তোমরা যার ইবাদত করো আমি তার ইবাদত করি না।', 'I do not worship what you worship.'],
    ['وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ', 'ওয়া লা আনতুম ‘আ-বিদূনা মা আ‘বুদ।', 'Wa la antum ‘abiduna ma a‘bud.', 'আর আমি যার ইবাদত করি তোমরাও তার ইবাদতকারী নও।', 'Nor are you worshippers of what I worship.'],
    ['وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ', 'ওয়া লা আনা ‘আ-বিদুম মা ‘আবাত্তুম।', 'Wa la ana ‘abidum ma ‘abadtum.', 'আর তোমরা যার ইবাদত করেছ আমি তার ইবাদতকারী হব না।', 'Nor will I be a worshipper of what you worship.'],
    ['وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ', 'ওয়া লা আনতুম ‘আ-বিদূনা মা আ‘বুদ।', 'Wa la antum ‘abiduna ma a‘bud.', 'আর আমি যার ইবাদত করি তোমরাও তার ইবাদতকারী হবে না।', 'Nor will you be worshippers of what I worship.'],
    ['لَكُمْ دِينُكُمْ وَلِيَ دِينِ', 'লাকুম দীনুকুম ওয়ালিয়া দীন।', 'Lakum dinukum wa liya din.', 'তোমাদের জন্য তোমাদের দ্বীন, আমার জন্য আমার দ্বীন।', 'For you is your religion, and for me is my religion.']]],
  110: ['নাসর', 'An-Nasr', [
    ['إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ', 'ইযা জা-আ নাসরুল্লা-হি ওয়াল ফাতহ।', 'Idha ja’a nasrullahi wal-fath.', 'যখন আল্লাহর সাহায্য ও বিজয় আসবে,', 'When the help of Allah and the conquest come,'],
    ['وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا', 'ওয়া রাআইতান্না-সা ইয়াদখুলূনা ফী দীনিল্লা-হি আফওয়া-জা।', 'Wa ra’aytan-nasa yadkhuluna fi dinillahi afwaja.', 'আর তুমি মানুষকে দলে দলে আল্লাহর দ্বীনে প্রবেশ করতে দেখবে,', 'And you see the people entering the religion of Allah in multitudes,'],
    ['فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ ۚ إِنَّهُ كَانَ تَوَّابًا', 'ফাসাব্বিহ বিহামদি রাব্বিকা ওয়াসতাগফিরহু, ইন্নাহূ কা-না তাওওয়া-বা।', 'Fasabbih bihamdi rabbika wastaghfirh, innahu kana tawwaba.', 'তখন তোমার রবের প্রশংসাসহ তাসবিহ পড়ো আর তাঁর কাছে ক্ষমা চাও। নিশ্চয়ই তিনি তাওবা কবুলকারী।', 'Then exalt Him with praise of your Lord and seek His forgiveness. Indeed, He is ever Accepting of repentance.']]],
  111: ['লাহাব', 'Al-Masad (Al-Lahab)', [
    ['تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ', 'তাব্বাত ইয়াদা আবী লাহাবিঁউ ওয়া তাব্ব।', 'Tabbat yada Abi Lahabin wa tabb.', 'ধ্বংস হোক আবু লাহাবের দুই হাত, আর সে নিজেও ধ্বংস হোক।', 'May the hands of Abu Lahab be ruined, and ruined is he.'],
    ['مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ', 'মা আগনা ‘আনহু মা-লুহূ ওয়া মা কাসাব।', 'Ma aghna ‘anhu maluhu wa ma kasab.', 'তার সম্পদ ও উপার্জন তার কাজে আসেনি।', 'His wealth and what he earned will not benefit him.'],
    ['سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ', 'সাইয়াসলা নারান যা-তা লাহাব।', 'Sayasla naran dhata lahab.', 'সে শিগগিরই লেলিহান আগুনে প্রবেশ করবে,', 'He will burn in a Fire of blazing flame,'],
    ['وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ', 'ওয়ামরাআতুহূ হাম্মা-লাতাল হাতাব।', 'Wamra’atuhu hammalatal-hatab.', 'আর তার স্ত্রীও, যে কাঠ (কাঁটা/চোগলখুরি) বহন করে বেড়ায়,', 'And his wife, the carrier of firewood (thorns/slander),'],
    ['فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ', 'ফী জীদিহা হাবলুম মিম মাসাদ।', 'Fi jidiha hablum mim masad.', 'তার গলায় থাকবে খেজুর-আঁশের পাকানো দড়ি।', 'Around her neck is a rope of twisted fiber.']]],
  112: ['ইখলাস', 'Al-Ikhlas', [
    ['قُلْ هُوَ اللَّهُ أَحَدٌ', 'কুল হুওয়াল্লা-হু আহাদ।', 'Qul huwallahu ahad.', 'বলো, তিনি আল্লাহ, এক।', 'Say: He is Allah, One.'],
    ['اللَّهُ الصَّمَدُ', 'আল্লা-হুস সামাদ।', 'Allahus-samad.', 'আল্লাহ অমুখাপেক্ষী (সবাই তাঁর মুখাপেক্ষী)।', 'Allah, the Eternal Refuge (all depend on Him).'],
    ['لَمْ يَلِدْ وَلَمْ يُولَدْ', 'লাম ইয়ালিদ ওয়া লাম ইউলাদ।', 'Lam yalid wa lam yulad.', 'তিনি কাউকে জন্ম দেননি, তাঁকেও জন্ম দেওয়া হয়নি।', 'He neither begets nor is born,'],
    ['وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ', 'ওয়া লাম ইয়াকুল্লাহূ কুফুওয়ান আহাদ।', 'Wa lam yakun lahu kufuwan ahad.', 'আর তাঁর সমকক্ষ কেউ নেই।', 'Nor is there to Him any equivalent.']]],
  113: ['ফালাক', 'Al-Falaq', [
    ['قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ', 'কুল আ‘ঊযু বিরাব্বিল ফালাক।', 'Qul a‘udhu birabbil-falaq.', 'বলো, আমি আশ্রয় চাই ভোরের রবের কাছে,', 'Say: I seek refuge in the Lord of daybreak,'],
    ['مِن شَرِّ مَا خَلَقَ', 'মিন শাররি মা খালাক।', 'Min sharri ma khalaq.', 'তিনি যা সৃষ্টি করেছেন তার অনিষ্ট থেকে,', 'From the evil of what He created,'],
    ['وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ', 'ওয়া মিন শাররি গা-সিকিন ইযা ওয়াকাব।', 'Wa min sharri ghasiqin idha waqab.', 'অন্ধকার রাতের অনিষ্ট থেকে, যখন তা ছেয়ে যায়,', 'And from the evil of darkness when it settles,'],
    ['وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ', 'ওয়া মিন শাররিন নাফফা-সা-তি ফিল ‘উকাদ।', 'Wa min sharrin-naffathati fil-‘uqad.', 'গিরায় ফুঁ-দানকারিণীদের অনিষ্ট থেকে,', 'And from the evil of those who blow on knots,'],
    ['وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ', 'ওয়া মিন শাররি হা-সিদিন ইযা হাসাদ।', 'Wa min sharri hasidin idha hasad.', 'আর হিংসুকের অনিষ্ট থেকে, যখন সে হিংসা করে।', 'And from the evil of an envier when he envies.']]],
  114: ['নাস', 'An-Nas', [
    ['قُلْ أَعُوذُ بِرَبِّ النَّاسِ', 'কুল আ‘ঊযু বিরাব্বিন নাস।', 'Qul a‘udhu birabbin-nas.', 'বলো, আমি আশ্রয় চাই মানুষের রবের কাছে,', 'Say: I seek refuge in the Lord of mankind,'],
    ['مَلِكِ النَّاسِ', 'মালিকিন নাস।', 'Malikin-nas.', 'মানুষের বাদশাহর,', 'The Sovereign of mankind,'],
    ['إِلَٰهِ النَّاسِ', 'ইলা-হিন নাস।', 'Ilahin-nas.', 'মানুষের ইলাহর,', 'The God of mankind,'],
    ['مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ', 'মিন শাররিল ওয়াসওয়া-সিল খান্নাস।', 'Min sharril-waswasil-khannas.', 'আত্মগোপনকারী কুমন্ত্রণাদাতার অনিষ্ট থেকে,', 'From the evil of the retreating whisperer,'],
    ['الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ', 'আল্লাযী ইউওয়াসউইসু ফী সুদূরিন নাস।', 'Alladhi yuwaswisu fi suduril-nas.', 'যে মানুষের অন্তরে কুমন্ত্রণা দেয়,', 'Who whispers in the hearts of mankind,'],
    ['مِنَ الْجِنَّةِ وَالنَّاسِ', 'মিনাল জিন্নাতি ওয়ান নাস।', 'Minal-jinnati wan-nas.', 'জিন ও মানুষের মধ্য থেকে।', 'Among jinn and among mankind.']]]
};

const MULK = mkTx([
  ['تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ', 'তাবা-রাকাল্লাযী বিয়াদিহিল মুলকু ওয়া হুওয়া ‘আলা কুল্লি শাইয়িন কাদীর।', 'Tabarakal-ladhi biyadihil-mulku wa huwa ‘ala kulli shay’in qadir.', 'বরকতময় তিনি, যাঁর হাতে সমস্ত কর্তৃত্ব, আর তিনি সবকিছুর ওপর ক্ষমতাবান।', 'Blessed is He in whose hand is dominion, and He is over all things competent.'],
  ['الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ', 'আল্লাযী খালাকাল মাওতা ওয়াল হায়া-তা লিইয়াবলুওয়াকুম আইয়ুকুম আহসানু ‘আমালা, ওয়া হুওয়াল ‘আযীযুল গাফূর।', 'Alladhi khalaqal-mawta wal-hayata liyabluwakum ayyukum ahsanu ‘amala, wa huwal-‘Azizul-Ghafur.', 'যিনি মৃত্যু ও জীবন সৃষ্টি করেছেন, যাতে পরীক্ষা করেন তোমাদের মধ্যে কে কাজে উত্তম। তিনি পরাক্রমশালী, ক্ষমাশীল।', 'Who created death and life to test which of you is best in deed; and He is the Exalted in Might, the Forgiving.'],
  ['الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ', 'আল্লাযী খালাকা সাব‘আ সামা-ওয়া-তিন তিবা-কা-, মা তারা ফী খালকির রাহমা-নি মিন তাফাঊত, ফারজি‘ইল বাসারা হাল তারা মিন ফুতূর।', 'Alladhi khalaqa sab‘a samawatin tibaqa, ma tara fi khalqir-Rahmani min tafawut, farji‘il-basara hal tara min futur.', 'যিনি স্তরে স্তরে সাত আসমান সৃষ্টি করেছেন। দয়াময়ের সৃষ্টিতে তুমি কোনো অসামঞ্জস্য দেখবে না। আবার তাকাও, কোনো ফাটল দেখতে পাও কি?', 'Who created seven heavens in layers. You do not see in the creation of the Most Merciful any inconsistency. So look again: do you see any breaks?'],
  ['ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ', 'সুম্মারজি‘ইল বাসারা কাররাতাইনি ইয়ানকালিব ইলাইকাল বাসারু খা-সিআঁও ওয়া হুওয়া হাসীর।', 'Thummarji‘il-basara karratayni yanqalib ilaykal-basaru khasi’an wa huwa hasir.', 'তারপর বারবার তাকাও, তোমার দৃষ্টি ব্যর্থ ও ক্লান্ত হয়ে তোমার কাছে ফিরে আসবে।', 'Then look again and again; your sight will return to you humbled and weary.'],
  ['وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ', 'ওয়া লাকাদ যাইয়্যান্নাস সামা-আদ দুনইয়া বিমাসা-বীহা ওয়া জা‘আলনা-হা রুজূমাল লিশ শায়া-তীন, ওয়া আ‘তাদনা লাহুম ‘আযা-বাস সা‘ঈর।', 'Wa laqad zayyannas-sama’ad-dunya bimasabiha wa ja‘alnaha rujumal lish-shayatin, wa a‘tadna lahum ‘adhabas-sa‘ir.', 'আমি নিকটতম আসমানকে প্রদীপমালায় সাজিয়েছি এবং সেগুলোকে শয়তানদের জন্য নিক্ষেপের বস্তু বানিয়েছি। তাদের জন্য প্রস্তুত রেখেছি জ্বলন্ত আগুনের শাস্তি।', 'And We have adorned the nearest heaven with lamps and made them missiles against the devils, and prepared for them the punishment of the Blaze.'],
  ['وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ الْمَصِيرُ', 'ওয়া লিল্লাযীনা কাফারূ বিরাব্বিহিম ‘আযা-বু জাহান্নাম, ওয়া বি’সাল মাসীর।', 'Wa lil-ladhina kafaru birabbihim ‘adhabu Jahannam, wa bi’sal-masir.', 'যারা তাদের রবকে অস্বীকার করে তাদের জন্য জাহান্নামের শাস্তি। কত নিকৃষ্ট সেই গন্তব্য!', 'For those who disbelieve in their Lord is the punishment of Hell, and wretched is the destination.'],
  ['إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ', 'ইযা উলকূ ফীহা সামি‘ঊ লাহা শাহীকাঁও ওয়া হিয়া তাফূর।', 'Idha ulqu fiha sami‘u laha shahiqan wa hiya tafur.', 'যখন তাদের সেখানে নিক্ষেপ করা হবে, তারা তার ভয়ংকর গর্জন শুনবে, আর তা উথলে উঠবে।', 'When they are thrown into it, they hear from it a dreadful inhaling while it boils up,'],
  ['تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ ۖ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ', 'তাকা-দু তামাইয়াযু মিনাল গাইয, কুল্লামা উলকিয়া ফীহা ফাওজুন সাআলাহুম খাযানাতুহা আলাম ইয়া’তিকুম নাযীর।', 'Takadu tamayyazu minal-ghayz, kullama ulqiya fiha fawjun sa’alahum khazanatuha alam ya’tikum nadhir.', 'ক্রোধে যেন ফেটে পড়বে। যখনই কোনো দল সেখানে নিক্ষিপ্ত হবে, তার প্রহরীরা জিজ্ঞেস করবে, “তোমাদের কাছে কি কোনো সতর্ককারী আসেনি?”', 'It almost bursts with rage. Every time a group is thrown into it, its keepers ask them, “Did there not come to you a warner?”'],
  ['قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ كَبِيرٍ', 'কা-লূ বালা কাদ জা-আনা নাযীরুন ফাকায্যাবনা ওয়া কুলনা মা নাযযালাল্লা-হু মিন শাইয়িন, ইন আনতুম ইল্লা ফী দালা-লিন কাবীর।', 'Qalu bala qad ja’ana nadhirun fakadhdhabna wa qulna ma nazzalallahu min shay’in, in antum illa fi dalalin kabir.', 'তারা বলবে, “হ্যাঁ, আমাদের কাছে সতর্ককারী এসেছিল, কিন্তু আমরা মিথ্যা বলেছিলাম আর বলেছিলাম, আল্লাহ কিছুই নাযিল করেননি, তোমরা তো বিরাট ভুলের মধ্যে আছ।”', 'They will say, “Yes, a warner had come to us, but we denied and said, ‘Allah has not sent down anything; you are only in great error.’”'],
  ['وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ', 'ওয়া কা-লূ লাও কুন্না নাসমা‘উ আও না‘কিলু মা কুন্না ফী আসহা-বিস সা‘ঈর।', 'Wa qalu law kunna nasma‘u aw na‘qilu ma kunna fi ashabis-sa‘ir.', 'আর বলবে, “আমরা যদি শুনতাম বা বুঝতাম, তবে জ্বলন্ত আগুনের অধিবাসী হতাম না।”', 'And they will say, “If only we had been listening or reasoning, we would not be among the companions of the Blaze.”'],
  ['فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ', 'ফা‘তারাফূ বিযাম্বিহিম, ফাসুহকাল লিআসহা-বিস সা‘ঈর।', 'Fa‘tarafu bidhanbihim, fasuhqan li-ashabis-sa‘ir.', 'এভাবে তারা নিজেদের অপরাধ স্বীকার করবে। অতএব ধ্বংস জ্বলন্ত আগুনের অধিবাসীদের জন্য।', 'And they will admit their sin; so, away with the companions of the Blaze.'],
  ['إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ', 'ইন্নাল্লাযীনা ইয়াখশাওনা রাব্বাহুম বিলগাইবি লাহুম মাগফিরাতুঁও ওয়া আজরুন কাবীর।', 'Innal-ladhina yakhshawna rabbahum bil-ghaybi lahum maghfiratun wa ajrun kabir.', 'যারা না দেখেও তাদের রবকে ভয় করে, তাদের জন্য আছে ক্ষমা ও বড় প্রতিদান।', 'Indeed, those who fear their Lord unseen will have forgiveness and a great reward.'],
  ['وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ ۖ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ', 'ওয়া আসিররূ কাওলাকুম আওিজহারূ বিহ, ইন্নাহূ ‘আলীমুম বিযা-তিস সুদূর।', 'Wa asirru qawlakum awijharu bih, innahu ‘alimum bidhatis-sudur.', 'তোমরা কথা গোপনে বলো বা প্রকাশ্যে, তিনি অন্তরের কথাও জানেন।', 'Whether you conceal your speech or publicize it, He is Knowing of what is within the hearts.'],
  ['أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ', 'আলা ইয়া‘লামু মান খালাক, ওয়া হুওয়াল লাতীফুল খাবীর।', 'Ala ya‘lamu man khalaq, wa huwal-Latiful-Khabir.', 'যিনি সৃষ্টি করেছেন তিনি কি জানবেন না? তিনি সূক্ষ্মদর্শী, সর্বজ্ঞ।', 'Does He who created not know, while He is the Subtle, the Acquainted?'],
  ['هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ ۖ وَإِلَيْهِ النُّشُورُ', 'হুওয়াল্লাযী জা‘আলা লাকুমুল আরদা যালূলান ফামশূ ফী মানা-কিবিহা ওয়া কুলূ মির রিযকিহ, ওয়া ইলাইহিন নুশূর।', 'Huwal-ladhi ja‘ala lakumul-arda dhalulan famshu fi manakibiha wa kulu mir-rizqih, wa ilayhin-nushur.', 'তিনিই তোমাদের জন্য জমিনকে সহজ করেছেন। তাই তার পথে পথে চলো আর তাঁর রিযিক থেকে খাও। তাঁর কাছেই পুনরুত্থান।', 'It is He who made the earth tame for you; so walk among its slopes and eat of His provision, and to Him is the resurrection.'],
  ['أَأَمِنتُم مَّن فِي السَّمَاءِ أَن يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ', 'আ আমিনতুম মান ফিস সামা-ই আন ইয়াখসিফা বিকুমুল আরদা ফাইযা হিয়া তামূর।', 'A amintum man fis-sama’i an yakhsifa bikumul-arda fa-idha hiya tamur.', 'আসমানে যিনি আছেন, তিনি তোমাদের সহ জমিনকে ধসিয়ে দেবেন না, এ নিয়ে কি তোমরা নিশ্চিন্ত? তখন তা থরথর করে কাঁপবে।', 'Do you feel secure that He who is above will not cause the earth to swallow you while it shakes?'],
  ['أَمْ أَمِنتُم مَّن فِي السَّمَاءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ', 'আম আমিনতুম মান ফিস সামা-ই আন ইউরসিলা ‘আলাইকুম হা-সিবা, ফাসাতা‘লামূনা কাইফা নাযীর।', 'Am amintum man fis-sama’i an yursila ‘alaykum hasiba, fasata‘lamuna kayfa nadhir.', 'নাকি নিশ্চিন্ত যে তিনি তোমাদের ওপর পাথর-বৃষ্টি পাঠাবেন না? তখন জানবে আমার সতর্কবাণী কেমন ছিল।', 'Or do you feel secure that He will not send upon you a storm of stones? Then you would know how My warning was.'],
  ['وَلَقَدْ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ', 'ওয়া লাকাদ কায্যাবাল্লাযীনা মিন কাবলিহিম ফাকাইফা কা-না নাকীর।', 'Wa laqad kadhdhabal-ladhina min qablihim fakayfa kana nakir.', 'তাদের আগের লোকেরাও মিথ্যা বলেছিল, তখন আমার প্রতিবাদ (শাস্তি) কেমন ছিল!', 'And already those before them denied, and how severe was My reproach.'],
  ['أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَٰنُ ۚ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ', 'আওয়ালাম ইয়ারাও ইলাত তাইরি ফাওকাহুম সা-ফফা-তিঁও ওয়া ইয়াকবিদ্না, মা ইউমসিকুহুন্না ইল্লার রাহমা-ন, ইন্নাহূ বিকুল্লি শাইয়িম বাসীর।', 'Awalam yaraw ilat-tayri fawqahum saffatin wa yaqbidn, ma yumsikuhunna illar-Rahman, innahu bikulli shay’im basir.', 'তারা কি তাদের ওপরে পাখিদের ডানা মেলতে ও গুটাতে দেখে না? দয়াময় ছাড়া কেউ তাদের ধরে রাখেন না। তিনি সবকিছুর দ্রষ্টা।', 'Do they not see the birds above them, spreading their wings and withdrawing them? None holds them up except the Most Merciful. Indeed He is, of all things, Seeing.'],
  ['أَمَّنْ هَٰذَا الَّذِي هُوَ جُندٌ لَّكُمْ يَنصُرُكُم مِّن دُونِ الرَّحْمَٰنِ ۚ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ', 'আম্মান হা-যাল্লাযী হুওয়া জুন্দুল লাকুম ইয়ানসুরুকুম মিন দূনির রাহমা-ন, ইনিল কা-ফিরূনা ইল্লা ফী গুরূর।', 'Amman hadhal-ladhi huwa jundul-lakum yansurukum min dunir-Rahman, inil-kafiruna illa fi ghurur.', 'দয়াময় ছাড়া কে এমন আছে যে তোমাদের বাহিনী হয়ে সাহায্য করবে? কাফিররা তো শুধু প্রতারণায় পড়ে আছে।', 'Who is it that could be an army for you to aid you other than the Most Merciful? The disbelievers are only in delusion.'],
  ['أَمَّنْ هَٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ ۚ بَل لَّجُّوا فِي عُتُوٍّ وَنُفُورٍ', 'আম্মান হা-যাল্লাযী ইয়ারযুকুকুম ইন আমসাকা রিযকাহ, বাল লাজ্জূ ফী ‘উতুব্বিঁও ওয়া নুফূর।', 'Amman hadhal-ladhi yarzuqukum in amsaka rizqah, bal lajju fi ‘utuwwin wa nufur.', 'তিনি রিযিক বন্ধ করলে কে তোমাদের রিযিক দেবে? বরং তারা অবাধ্যতা ও বিমুখতায় অটল।', 'Or who is it that could provide for you if He withheld His provision? But they persist in arrogance and aversion.'],
  ['أَفَمَن يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ أَمَّن يَمْشِي سَوِيًّا عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ', 'আফামাই ইয়ামশী মুকিব্বান ‘আলা ওয়াজহিহী আহদা আম্মাই ইয়ামশী সাওয়িয়্যান ‘আলা সিরা-তিম মুস্তাকীম।', 'Afaman yamshi mukibban ‘ala wajhihi ahda amman yamshi sawiyyan ‘ala siratim mustaqim.', 'যে মুখ নিচু করে চলে সে বেশি সঠিক পথে, নাকি যে সোজা হয়ে সরল পথে চলে?', 'Is one who walks fallen on his face better guided, or one who walks upright on a straight path?'],
  ['قُلْ هُوَ الَّذِي أَنشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۖ قَلِيلًا مَّا تَشْكُرُونَ', 'কুল হুওয়াল্লাযী আনশাআকুম ওয়া জা‘আলা লাকুমুস সাম‘আ ওয়াল আবসা-রা ওয়াল আফইদাহ, কালীলাম মা তাশকুরূন।', 'Qul huwal-ladhi ansha’akum wa ja‘ala lakumus-sam‘a wal-absara wal-af’idah, qalilam ma tashkurun.', 'বলো, তিনিই তোমাদের সৃষ্টি করেছেন এবং দিয়েছেন কান, চোখ ও অন্তর। তোমরা খুব কমই কৃতজ্ঞতা জানাও।', 'Say: It is He who produced you and made for you hearing, vision and hearts; little are you grateful.'],
  ['قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ', 'কুল হুওয়াল্লাযী যারাআকুম ফিল আরদি ওয়া ইলাইহি তুহশারূন।', 'Qul huwal-ladhi dhara’akum fil-ardi wa ilayhi tuhsharun.', 'বলো, তিনিই তোমাদের জমিনে ছড়িয়ে দিয়েছেন, আর তাঁর কাছেই তোমাদের একত্র করা হবে।', 'Say: It is He who has multiplied you throughout the earth, and to Him you will be gathered.'],
  ['وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ', 'ওয়া ইয়াকূলূনা মাতা হা-যাল ওয়া‘দু ইন কুনতুম সা-দিকীন।', 'Wa yaqulun mata hadhal-wa‘du in kuntum sadiqin.', 'তারা বলে, “তোমরা সত্যবাদী হলে এই প্রতিশ্রুতি কবে?”', 'And they say, “When is this promise, if you should be truthful?”'],
  ['قُلْ إِنَّمَا الْعِلْمُ عِندَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُّبِينٌ', 'কুল ইন্নামাল ‘ইলমু ‘ইনদাল্লা-হি ওয়া ইন্নামা আনা নাযীরুম মুবীন।', 'Qul innamal-‘ilmu ‘indallahi wa innama ana nadhirum mubin.', 'বলো, এর জ্ঞান শুধু আল্লাহর কাছে। আমি তো কেবল স্পষ্ট সতর্ককারী।', 'Say: The knowledge is only with Allah, and I am only a clear warner.'],
  ['فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا وَقِيلَ هَٰذَا الَّذِي كُنتُم بِهِ تَدَّعُونَ', 'ফালাম্মা রাআওহু যুলফাতান সী-আত উজূহুল্লাযীনা কাফারূ ওয়া কীলা হা-যাল্লাযী কুনতুম বিহী তাদ্দা‘ঊন।', 'Falamma ra’awhu zulfatan si’at wujuhul-ladhina kafaru wa qila hadhal-ladhi kuntum bihi tadda‘un.', 'যখন তারা তা কাছে দেখবে, কাফিরদের চেহারা মলিন হয়ে যাবে। বলা হবে, “এটাই তো তোমরা চাইছিলে।”', 'But when they see it near, the faces of those who disbelieved will be distressed, and it will be said, “This is that for which you used to call.”'],
  ['قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا فَمَن يُجِيرُ الْكَافِرِينَ مِنْ عَذَابٍ أَلِيمٍ', 'কুল আরাআইতুম ইন আহলাকানিয়াল্লা-হু ওয়া মাম মা‘ইয়া আও রাহিমানা ফামাই ইউজীরুল কা-ফিরীনা মিন ‘আযা-বিন আলীম।', 'Qul ara’aytum in ahlakaniyallahu wa mam-ma‘iya aw rahimana faman yujirul-kafirina min ‘adhabin alim.', 'বলো, ভেবে দেখেছ কি, আল্লাহ আমাকে ও আমার সঙ্গীদের ধ্বংস করুন বা দয়া করুন, কাফিরদের যন্ত্রণাদায়ক শাস্তি থেকে কে বাঁচাবে?', 'Say: Have you considered: whether Allah destroys me and those with me or has mercy upon us, who can protect the disbelievers from a painful punishment?'],
  ['قُلْ هُوَ الرَّحْمَٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِي ضَلَالٍ مُّبِينٍ', 'কুল হুওয়ার রাহমা-নু আ-মান্না বিহী ওয়া ‘আলাইহি তাওয়াক্কালনা, ফাসাতা‘লামূনা মান হুওয়া ফী দালা-লিম মুবীন।', 'Qul huwar-Rahmanu amanna bihi wa ‘alayhi tawakkalna, fasata‘lamuna man huwa fi dalalim mubin.', 'বলো, তিনি দয়াময়। আমরা তাঁর ওপর ঈমান এনেছি আর তাঁরই ওপর ভরসা করেছি। শিগগিরই জানবে কে স্পষ্ট বিভ্রান্তিতে আছে।', 'Say: He is the Most Merciful; we have believed in Him, and upon Him we have relied. So you will come to know who it is that is in clear error.'],
  ['قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ', 'কুল আরাআইতুম ইন আসবাহা মা-উকুম গাওরান ফামাই ইয়া’তীকুম বিমা-ইম মা‘ীন।', 'Qul ara’aytum in asbaha ma’ukum ghawran faman ya’tikum bima’im ma‘in.', 'বলো, ভেবে দেখেছ কি, তোমাদের পানি যদি মাটির গভীরে চলে যায়, তবে কে তোমাদের বহমান পানি এনে দেবে?', 'Say: Have you considered: if your water was to become sunken [into the earth], then who could bring you flowing water?']
]);
const KAHF = mkTx([
  ['الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَل لَّهُ عِوَجًا', 'আলহামদু লিল্লা-হিল্লাযী আনযালা ‘আলা ‘আবদিহিল কিতা-বা ওয়া লাম ইয়াজ‘আল লাহূ ‘ইওয়াজা।', 'Alhamdu lillahil-ladhi anzala ‘ala ‘abdihil-kitaba wa lam yaj‘al lahu ‘iwaja.', 'সব প্রশংসা আল্লাহর, যিনি তাঁর বান্দার ওপর কিতাব নাযিল করেছেন এবং তাতে কোনো বক্রতা রাখেননি।', 'All praise is due to Allah, who has sent down upon His servant the Book and has not made therein any crookedness.'],
  ['قَيِّمًا لِّيُنذِرَ بَأْسًا شَدِيدًا مِّن لَّدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا', 'কাইয়িমাল লিইউনযিরা বা’সান শাদীদাম মিল লাদুনহু ওয়া ইউবাশশিরাল মু’মিনীনাল্লাযীনা ইয়া‘মালূনাস সা-লিহা-তি আন্না লাহুম আজরান হাসানা।', 'Qayyimal liyundhira ba’san shadidam mil-ladunhu wa yubashshiral-mu’minina-lladhina ya‘malunas-salihati anna lahum ajran hasana.', 'সুপ্রতিষ্ঠিত, যাতে তিনি তাঁর পক্ষ থেকে কঠিন শাস্তির সতর্কবাণী দেন এবং সৎকর্মশীল মুমিনদের সুসংবাদ দেন যে তাদের জন্য উত্তম প্রতিদান আছে,', 'Straight, to warn of severe punishment from Him and to give good tidings to the believers who do righteous deeds that they will have a good reward,'],
  ['مَّاكِثِينَ فِيهِ أَبَدًا', 'মা-কিসীনা ফীহি আবাদা।', 'Makithina fihi abada.', 'যেখানে তারা চিরকাল থাকবে।', 'In which they will remain forever.'],
  ['وَيُنذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا', 'ওয়া ইউনযিরাল্লাযীনা কা-লুত্তাখাযাল্লা-হু ওয়ালাদা।', 'Wa yundhiral-ladhina qalut-takhadhallahu walada.', 'আর তাদের সতর্ক করেন যারা বলে, “আল্লাহ সন্তান গ্রহণ করেছেন।”', 'And to warn those who say, “Allah has taken a son.”'],
  ['مَّا لَهُم بِهِ مِنْ عِلْمٍ وَلَا لِآبَائِهِمْ ۚ كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ أَفْوَاهِهِمْ ۚ إِن يَقُولُونَ إِلَّا كَذِبًا', 'মা লাহুম বিহী মিন ‘ইলমিঁও ওয়া লা লিআ-বা-ইহিম, কাবুরাত কালিমাতান তাখরুজু মিন আফওয়া-হিহিম, ইঁ ইয়াকূলূনা ইল্লা কাযিবা।', 'Ma lahum bihi min ‘ilmin wa la li-aba’ihim, kaburat kalimatan takhruju min afwahihim, in yaqulun illa kadhiba.', 'এ ব্যাপারে তাদের বা তাদের পূর্বপুরুষদের কোনো জ্ঞান নেই। কত বড় কথা তাদের মুখ থেকে বের হয়! তারা শুধু মিথ্যাই বলে।', 'They have no knowledge of it, nor had their fathers. Grave is the word that comes out of their mouths; they speak not except a lie.'],
  ['فَلَعَلَّكَ بَاخِعٌ نَّفْسَكَ عَلَىٰ آثَارِهِمْ إِن لَّمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا', 'ফালা‘আল্লাকা বা-খি‘উন নাফসাকা ‘আলা আ-সা-রিহিম ইল্লাম ইউ’মিনূ বিহা-যাল হাদীসি আসাফা।', 'Fala‘allaka bakhi‘un nafsaka ‘ala atharihim il-lam yu’minu bihadhal-hadithi asafa.', 'তারা এই বাণীতে ঈমান না আনলে তাদের পেছনে দুঃখে হয়তো তুমি নিজেকে শেষ করে দেবে।', 'Perhaps you would kill yourself through grief over them if they do not believe in this message.'],
  ['إِنَّا جَعَلْنَا مَا عَلَى الْأَرْضِ زِينَةً لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا', 'ইন্না জা‘আলনা মা ‘আলাল আরদি যীনাতাল লাহা লিনাবলুওয়াহুম আইয়ুহুম আহসানু ‘আমালা।', 'Inna ja‘alna ma ‘alal-ardi zinatal-laha linabluwahum ayyuhum ahsanu ‘amala.', 'জমিনের ওপর যা আছে তা আমি তার সৌন্দর্য বানিয়েছি, যাতে পরীক্ষা করি কে কাজে উত্তম।', 'Indeed, We have made that which is on the earth adornment for it that We may test them as to which of them is best in deed.'],
  ['وَإِنَّا لَجَاعِلُونَ مَا عَلَيْهَا صَعِيدًا جُرُزًا', 'ওয়া ইন্না লাজা-‘ইলূনা মা ‘আলাইহা সা‘ীদান জুরুযা।', 'Wa inna lajali‘una ma ‘alayha sa‘idan juruza.', 'আর তার ওপর যা আছে সবই আমি অবশ্যই শুকনো, বৃক্ষহীন মাটিতে পরিণত করব।', 'And indeed We will make that which is on it a barren ground.'],
  ['أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ آيَاتِنَا عَجَبًا', 'আম হাসিবতা আন্না আসহা-বাল কাহফি ওয়ার রাকীমি কা-নূ মিন আ-য়া-তিনা ‘আজাবা।', 'Am hasibta anna ashabal-kahfi war-raqimi kanu min ayatina ‘ajaba.', 'তুমি কি মনে করো গুহা ও রাকীমের অধিবাসীরা আমার নিদর্শনের মধ্যে খুব আশ্চর্যের ছিল?', 'Or have you thought that the companions of the cave and the inscription were, among Our signs, a wonder?'],
  ['إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا', 'ইয আওয়াল ফিতইয়াতু ইলাল কাহফি ফাকা-লূ রাব্বানা আ-তিনা মিল লাদুনকা রাহমাতাঁও ওয়া হাইয়ি’ লানা মিন আমরিনা রাশাদা।', 'Idh awal-fityatu ilal-kahfi faqalu rabbana atina min ladunka rahmatan wa hayyi’ lana min amrina rashada.', 'যখন যুবকেরা গুহায় আশ্রয় নিল এবং বলল, “হে আমাদের রব, আপনার পক্ষ থেকে আমাদের রহমত দিন আর আমাদের কাজে সঠিক পথ ঠিক করে দিন।”', 'When the youths retreated to the cave and said, “Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.”']
]);
const BAQ5 = mkTx([
  ['الم', 'আলিফ-লা-ম-মীম।', 'Alif-Lam-Mim.', 'আলিফ-লাম-মীম। (হরফে মুকাত্তাআত, এর প্রকৃত অর্থ আল্লাহই জানেন)', 'Alif, Lam, Meem. (Disjointed letters; their true meaning is known to Allah.)'],
  ['ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ', 'যা-লিকাল কিতা-বু লা রাইবা ফীহি হুদাল লিলমুত্তাকীন।', 'Dhalikal-kitabu la rayba fih, hudal lil-muttaqin.', 'এটা সেই কিতাব, যাতে কোনো সন্দেহ নেই। মুত্তাকিদের জন্য পথনির্দেশ।', 'This is the Book about which there is no doubt, a guidance for those conscious of Allah.'],
  ['الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ', 'আল্লাযীনা ইউ’মিনূনা বিলগাইবি ওয়া ইউকীমূনাস সালা-তা ওয়া মিম্মা রাযাকনা-হুম ইউনফিকূন।', 'Alladhina yu’minuna bil-ghaybi wa yuqimunas-salata wa mimma razaqnahum yunfiqun.', 'যারা না দেখে বিশ্বাস করে, নামাজ কায়েম করে এবং আমি যা দিয়েছি তা থেকে খরচ করে,', 'Who believe in the unseen, establish prayer, and spend out of what We have provided for them,'],
  ['وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ', 'ওয়াল্লাযীনা ইউ’মিনূনা বিমা উনযিলা ইলাইকা ওয়া মা উনযিলা মিন কাবলিকা ওয়া বিলআ-খিরাতি হুম ইউকিনূন।', 'Walladhina yu’minuna bima unzila ilayka wa ma unzila min qablika wa bil-akhirati hum yuqinun.', 'আর যারা তোমার ওপর যা নাযিল হয়েছে এবং তোমার আগে যা নাযিল হয়েছে তাতে বিশ্বাস করে, আর আখিরাতে দৃঢ় বিশ্বাস রাখে।', 'And who believe in what was revealed to you and what was revealed before you, and of the Hereafter they are certain.'],

/* ---- Reminders (medicine etc.) ---- */

function dosesFor(day) { const o = []; S.rm.forEach(r => { if (!r.on || (r.s && day < r.s) || (r.e && day > r.e)) return; r.t.forEach(t => o.push({ id: r.id, r, t, key: r.id + '@' + t })); }); return o.sort((a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0); }

const RF_K = 'ad_rf';

function rmBeep() { try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const c = new A(); [0, .28, .56].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0, c.currentTime + t); g.gain.linearRampToValueAtTime(.25, c.currentTime + t + .03); g.gain.linearRampToValueAtTime(0, c.currentTime + t + .22); o.start(c.currentTime + t); o.stop(c.currentTime + t + .25); }); setTimeout(() => c.close && c.close(), 1500); } catch (e) { } }

function remTick() {
